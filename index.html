  <script>
    'use strict';
    const items = [{"question":1,"slug":"q01-current-target","title":"Υφιστάμενο και νέο σύστημα","summary":"Το NCT-AI προσθέτει ελεγχόμενη ευφυΐα γύρω από το NCTSite, χωρίς να αντικαθιστά τις επίσημες πηγές δεδομένων.","nodes":[{"id":"n1","label":"NCTSite / Oracle","detail":"Επίσημα δεδομένα","status":"CURRENT","type":"database","slot":0},{"id":"n2","label":"Ελεγχόμενη πρόσβαση","detail":"Oracle MCP / Tool Gateway","status":"PARTIAL","type":"security","slot":1},{"id":"n3","label":"Εκτέλεση NCT-AI","detail":"Runtime / C# / Temporal","status":"MIXED","type":"backend","slot":2},{"id":"n4","label":"Διεπαφή AG-UI","detail":"Gateway / εγκρίσεις","status":"BUILT","type":"frontend","slot":3},{"id":"n5","label":"Γνώση και μοντέλα","detail":"OKF / ανάκτηση / Router","status":"MIXED","type":"database","slot":4},{"id":"n6","label":"Έλεγχος λειτουργίας","detail":"Policy / audit / CI-CD","status":"MIXED","type":"security","slot":5}],"edges":[{"from":"n1","to":"n2","label":"ανάγνωση","target":false},{"from":"n2","to":"n3","label":"δεδομένα","target":false},{"from":"n3","to":"n4","label":"αποτελέσματα","target":false},{"from":"n5","to":"n3","label":"στήριξη","target":false},{"from":"n6","to":"n5","label":"έλεγχοι","target":false}],"notes":["CURRENT (υφιστάμενο): WebForms/MVC, Oracle, SAP feed (τροφοδοσία), RP/TR και Entra ID παραμένουν.","Οι 18 νέες συνιστώσες ομαδοποιούνται σε επίπεδα, όχι σε 18 ήδη παραγωγικές υπηρεσίες. AKS ανάπτυξης έχει επιδειχθεί, συνεχής παραγωγική διαθεσιμότητα όχι.","Το επίπεδο γνώσης περιλαμβάνει compiler (μεταγλωττιστή), OKF repository (αποθετήριο), retrieval (ανάκτηση), PostgreSQL/pgvector και AGE. Μοντέλα μέσω Router και παρόχου, Redis για συνεδρίες.","Οι εγγραφές είναι χωριστό θέμα Q16/Q19: σήμερα μόνο DryRun (δοκιμαστική εκτέλεση χωρίς εγγραφή)."],"geometry":{"edge3":{"labelAt":[1095,280]}},"source":{"title":"Current State vs Target State slide, with new systems visible","body":"**Answer.** Yes. The presentation should distinguish the existing NCTSite/Oracle/external-systems\nlandscape from the eighteen new components NCT-AI introduces: AG-UI, API/BFF gateway, Agent Runtime,\nModel Router, Knowledge Compiler, the Approved OKF Knowledge Bundle repository, retrieval services,\nPostgreSQL/pgvector, graph knowledge via Apache AGE, the deterministic Rule Engine, Temporal workflow\norchestration, the MCP/Tool Gateway, the Oracle read-only MCP layer, the Policy/Guardrail service, the\nEvidence/Audit/Trace subsystem, the model provider (Azure OpenAI or local), Azure Managed Redis, and\nCI/CD/release controls. NCTSite and Oracle remain the authoritative systems of record; NCT-AI adds a\ngoverned intelligence and execution layer around them rather than replacing them\n(`nct-ai-architecture-design.md` §1–2, `nct-ai-azure-deployment.md` §1 carry the same distinction with\ndiagrams). The Azure implementation of this target is no longer only a paper architecture: an AKS\ndeployment of the NCT-AI service set has been executed and observed running.\n\nThe additional response explicitly retains NCTSite WebForms/MVC, Oracle, the SAP feed, RP/TR modules\nand Entra ID. External systems remain in place; retaining them does not eliminate interface work.\nThe requested slide should show existing flows separately from new interfaces and phase-gated writes\n(Q19–Q20). This questionnaire update does not itself deliver the revised presentation slides.","sha256":"d28faa0efcb9bee9d0e35e00765eb746148e6169c427b2da30e5e0bc2b4d7d6d"},"textDiagram":"[n1] NCTSite / Oracle [CURRENT]\n  +-- ανάγνωση --> [n2] Ελεγχόμενη πρόσβαση [PARTIAL]\n  |   +-- δεδομένα --> [n3] Εκτέλεση NCT-AI [MIXED]\n  |   |   +-- αποτελέσματα --> [n4] Διεπαφή AG-UI [BUILT]\n\n[n6] Έλεγχος λειτουργίας [MIXED]\n  +-- έλεγχοι --> [n5] Γνώση και μοντέλα [MIXED]\n  |   +-- στήριξη --> [n3] Εκτέλεση NCT-AI [MIXED] (αναφορά)"},{"question":2,"slug":"q02-model-providers","title":"Όριο παρόχων μοντέλων","summary":"Οι κλήσεις περνούν από το Models plane (επίπεδο μοντέλων), αλλά τα SDKs (κιτ ανάπτυξης παρόχων) ανήκουν στους adapters (προσαρμογείς), όχι στον Router (δρομολογητή).","nodes":[{"id":"n1","label":"Εφαρμογή NCT-AI","detail":"Ελεγχόμενη κλήση","status":"BUILT","type":"frontend","slot":0},{"id":"n2","label":"Models / Router","detail":"Ανεξάρτητα από πάροχο","status":"BUILT","type":"backend","slot":1},{"id":"n3","label":"AzureOpenAI adapter","detail":"Εδώ απομονώνεται το SDK","status":"BUILT","type":"backend","slot":2},{"id":"n4","label":"Azure OpenAI","detail":"Συνδεδεμένο στην ανάπτυξη","status":"DEV","type":"cloud","slot":3},{"id":"n5","label":"Τοπικός adapter","detail":"Δοκιμασμένη διεπαφή","status":"INTERFACE","type":"backend","slot":4},{"id":"n6","label":"On-premises μοντέλο","detail":"Εντός εγκαταστάσεων","status":"DESIGNED","type":"external","slot":5}],"edges":[{"from":"n1","to":"n2","label":"κλήση","target":false},{"from":"n2","to":"n3","label":"επιλογή","target":false},{"from":"n3","to":"n4","label":"SDK","target":false},{"from":"n2","to":"n5","label":"εναλλακτική","target":true},{"from":"n5","to":"n6","label":"εκκρεμεί","target":true}],"notes":["BUILT (υλοποιημένο): ουδέτερες συμβάσεις/Core, απομόνωση SDK και δοκιμές ορίων βιβλιοθηκών.","Azure-managed (διαχειριζόμενο), hybrid (υβριδικό) και on-premises (εντός εγκαταστάσεων) χρειάζονται χωριστή αξιολόγηση.","Τοπικό σύστημα παραγωγής δεν έχει τεκμηριωθεί. Η ανεξαρτησία παρόχου δεν εγγυάται γεωγραφία δεδομένων (Q15).","Οι εκτιμήσεις 90% κόστους Azure και EUR 200K GPU CAPEX (αρχική επένδυση) δεν είναι προσφορές."],"geometry":{"edge3":{"labelAt":[1095,280]},"edge4":{"labelAt":[640,280]}},"source":{"title":"Azure OpenAI & Local/On-Premises AI slide","body":"**Answer.** Every governed model call passes through the Models plane and Model Router; provider SDKs\nare isolated inside provider adapters such as `NCT.AI.Models.AzureOpenAI`. The router and core\ncontracts are provider-neutral. The same application-facing APIs can support Azure-managed, hybrid\nAzure/on-premises and fully on-premises inference without coupling business logic to a provider SDK.\n\n**Current state.** Azure OpenAI is connected in development. The local-provider interface is tested,\nbut a Production local-inference backend is not yet evidenced. Assembly-boundary tests verify the SDK\nseparation (Appendix B1). Provider independence does not itself enforce data residency: chat and\nembedding deployments have different processing scopes, as explained in Q15.\n\n**Target / remaining gap.** Azure-managed inference avoids customer-managed GPUs; local inference\noffers greater control of the data path but requires GPU investment, serving operations and capacity\nplanning. Hybrid adds two operating environments. Each option needs capability, security, quality and\nregression validation, including private connectivity and permitted egress. The source's hybrid\nestimate of approximately 90% of Azure runtime cost and approximately EUR 200K GPU CAPEX are\nunvalidated planning assumptions, not quotations or demonstrated savings.","sha256":"e50472c19be04b1e92cdb91b59e427151e58a59717451e34080227921cc70bf2"},"textDiagram":"[n1] Εφαρμογή NCT-AI [BUILT]\n  +-- κλήση --> [n2] Models / Router [BUILT]\n  |   +-- επιλογή --> [n3] AzureOpenAI adapter [BUILT]\n  |   |   +-- SDK --> [n4] Azure OpenAI [DEV]\n  |   +-- εναλλακτική / στόχος --> [n5] Τοπικός adapter [INTERFACE]\n  |   |   +-- εκκρεμεί / στόχος --> [n6] On-premises μοντέλο [DESIGNED]"},{"question":3,"slug":"q03-capacity","title":"Διαστασιολόγηση προς επικύρωση","summary":"Μία προτεινόμενη βάση UAT/παραγωγής, με τελική διαστασιολόγηση μόνο μετά από δοκιμές πραγματικού φόρτου.","nodes":[{"id":"n1","label":"Παραδοχές φόρτου","detail":"1.000 χρήστες / 20 γεννήσεις","status":"PROPOSAL","type":"external","slot":0},{"id":"n2","label":"UAT βάση","detail":"AKS 24-32 vCPU / 96-128 GB","status":"PROPOSAL","type":"cloud","slot":1},{"id":"n3","label":"Παραγωγή βάση","detail":"AKS 48-64 vCPU / 192-256 GB","status":"PROPOSAL","type":"cloud","slot":2},{"id":"n4","label":"Τελική διαστασιολόγηση","detail":"Μετά από μετρήσεις","status":"PENDING","type":"external","slot":3},{"id":"n5","label":"UAT μετρήσεις","detail":"Ουρές / p95 / πόροι","status":"REQUIRED","type":"backend","slot":4},{"id":"n6","label":"Χωρητικότητα παρόχου","detail":"RPM / TPM / tokens","status":"REQUIRED","type":"cloud","slot":5}],"edges":[{"from":"n1","to":"n2","label":"παραδοχές","target":true},{"from":"n2","to":"n3","label":"κλιμάκωση","target":true},{"from":"n3","to":"n4","label":"όχι έγκριση","target":true},{"from":"n6","to":"n5","label":"όρια","target":true},{"from":"n5","to":"n4","label":"επικύρωση","target":true}],"notes":["PROPOSAL (πρόταση), όχι εγκεκριμένη προμήθεια. Περίπου 100 ενεργοί χρήστες αιχμής και τυπικό context (περιεχόμενο εισόδου) 32K tokens.","PostgreSQL UAT: 4-8 vCPU, 32-64 GB, 256-512 GB. Παραγωγή: 8-16 vCPU, 64-128 GB, 0.5-1 TB.","Η πρόταση 2028+ βρίσκεται μόνο στο Παράρτημα A της πηγής ως εναλλακτική υπό αξιολόγηση. Οι πλήρεις πίνακες παραμένουν στην Q3.","GPU inference (εκτέλεση μοντέλου) και RPM/TPM (αιτήματα/tokens ανά λεπτό) μετρώνται χωριστά από CPU/RAM AKS."],"geometry":{"edge3":{"labelAt":[1095,280]}},"source":{"title":"UAT and Production sizing/capacity tables","body":"**Answer.** The tables below are the **recommended planning baseline**, not final procurement sizing — final values\nneed validation from performance/load testing against the real AGG-01 and subsequent use cases.\nPlanning assumptions: ~1,000 registered users, ~100 peak active users, ~20 concurrent LLM generations,\ntypical context ~32K tokens, multiple agent/model calls per complex request, embeddings enabled,\nproduction HA required. Where Azure OpenAI is used, model-inference GPU capacity sits outside the\nNCT-AI AKS CPU/RAM sizing below.\n\n**UAT baseline**\n\n| Component | CPU | RAM | Storage | Growth / notes |\n|---|---:|---:|---:|---|\n| AKS system + application workloads | 24–32 vCPU baseline | 96–128 GB | 200–300 GB ephemeral/platform | scale with test concurrency |\n| PostgreSQL / pgvector / AGE | 4–8 vCPU | 32–64 GB | 256–512 GB | plan 20–30% annual logical growth initially |\n| Temporal persistence/workers | shared or dedicated | 8–16 GB incremental if dedicated | 100–200 GB history budget | retention must be configured |\n| Redis | managed service | 2–6 GB cache | non-authoritative | cache only |\n| Knowledge/object artifacts | n/a | n/a | 250–500 GB | manuals, OKF, indexes, test sets |\n| Logs / traces | n/a | n/a | policy-driven | shorter retention in UAT |\n\nRecommended UAT topology: a minimum 3-node resilient cluster, separate system/application node pools\nwhere practical, Horizontal Pod Autoscaling, and non-production but production-like network/security\ncontrols.\n\n**Production baseline**\n\n| Component | CPU | RAM | Storage | Growth / notes |\n|---|---:|---:|---:|---|\n| AKS application baseline | 48–64 vCPU | 192–256 GB | 300–500 GB platform | autoscale to 96–128 vCPU / 384–512 GB at peak |\n| PostgreSQL / pgvector / AGE | 8–16 vCPU | 64–128 GB | 0.5–1 TB initial | measured per bundle/conversation/audit policy |\n| Temporal services/workers | horizontally scaled | workload-dependent | HA persistence | multiple replicas, per-workload queues |\n| Azure Managed Redis | managed HA tier | by cache profile | non-authoritative | sized from session/cache hit rate |\n| Knowledge/object storage | n/a | n/a | 0.5–1 TB initial | versioned manuals, bundles, artifacts |\n| Audit/log/trace | n/a | n/a | potentially 1+ TB/year | depends heavily on payload retention policy |\n\nThese figures are deliberately conservative planning ranges, to be validated against request rate,\ndocument corpus size, embedding chunk count, conversation retention, audit payload size, Temporal\nhistory retention, concurrent tool calls and actual rule-execution load. On-prem model inference needs\na separate GPU capacity table, driven by model choice, precision/quantisation, context length,\nconcurrency and required tokens/sec — it cannot be derived from the AKS figures alone.\n\nProvider capacity also needs model- and environment-specific RPM/TPM quotas (requests/tokens per\nminute), request arrival rate, input/output token distributions, calls per workflow, retries, and\np50/p95/p99 latency under an agreed workload. Twenty concurrent generations and a 32K context alone\ncannot establish throughput or cost. UAT must record quota throttling and queueing as well as AKS\nresource use; no validated Production quota or capacity guarantee is asserted here.\n\n**Target / remaining gap.** Validate this single recommended baseline in UAT before procurement.\nThe alternative 2028+ proposal is retained only in Appendix A as a scenario under evaluation, not a\nsecond recommendation or an approved capacity commitment.","sha256":"835553bf614ff746df631996239918417d3baab505d67a8e89cba2986a2da31a"},"textDiagram":"[n1] Παραδοχές φόρτου [PROPOSAL]\n  +-- παραδοχές / στόχος --> [n2] UAT βάση [PROPOSAL]\n  |   +-- κλιμάκωση / στόχος --> [n3] Παραγωγή βάση [PROPOSAL]\n  |   |   +-- όχι έγκριση / στόχος --> [n4] Τελική διαστασιολόγηση [PENDING]\n\n[n6] Χωρητικότητα παρόχου [REQUIRED]\n  +-- όρια / στόχος --> [n5] UAT μετρήσεις [REQUIRED]\n  |   +-- επικύρωση / στόχος --> [n4] Τελική διαστασιολόγηση [PENDING] (αναφορά)"},{"question":4,"slug":"q04-rules-and-knowledge","title":"C# και εγκεκριμένη γνώση","summary":"Η C# εκτελεί ελέγχους· το OKF τεκμηριώνει την εγκεκριμένη γνώση. Δεν υπάρχει αυτόματη μεταγλώττιση εγχειριδίων σε κανόνες C#.","nodes":[{"id":"n1","label":"NCTSite / Oracle","detail":"Τρέχοντα δεδομένα","status":"CURRENT","type":"database","slot":0},{"id":"n2","label":"Κανόνες C#","detail":"Τεχνική αξιολόγηση","status":"BUILT","type":"backend","slot":1},{"id":"n3","label":"Απόφαση AGG-01","detail":"Αποτέλεσμα και τεκμήρια","status":"BUILT","type":"frontend","slot":2},{"id":"n4","label":"Έγκριση και έκδοση","detail":"Διακυβέρνηση γνώσης","status":"BUILT","type":"security","slot":3},{"id":"n5","label":"OKF bundle","detail":"Εγκεκριμένο πακέτο γνώσης","status":"BUILT","type":"database","slot":4},{"id":"n6","label":"Rules-as-data","detail":"Επιλεκτικοί κανόνες ως δεδομένα","status":"DESIGNED","type":"backend","slot":5}],"edges":[{"from":"n1","to":"n2","label":"δεδομένα","target":false},{"from":"n2","to":"n3","label":"έλεγχοι","target":false},{"from":"n4","to":"n5","label":"εγκρίνει","target":false},{"from":"n5","to":"n2","label":"τεκμήρια","target":false},{"from":"n6","to":"n5","label":"μελλοντικά","target":true}],"notes":["BUILT (υλοποιημένο): C# rule engine (μηχανή κανόνων), επικύρωση/πακετάρισμα OKF και ιχνηλασιμότητα.","DESIGNED (σχεδιασμένο): επιλεκτική εκτέλεση δηλωτικών επιχειρησιακών κανόνων, με συνθήκες αξιολογήσιμες από μηχανή.","Αλλαγή σημερινής λογικής απαιτεί κώδικα, δοκιμές και έκδοση εφαρμογής. Hashes (αποτυπώματα) δεν αποδεικνύουν σημασιολογική συμφωνία.","Απαράβατοι κανόνες ασφαλείας και δικαιώματα παραμένουν σε κώδικα/πολιτική, ανεξάρτητα από γνώση ή LLM."],"geometry":{},"source":{"title":"Relationship between the Approved OKF Knowledge Bundle and executable deterministic rules","body":"**Answer.** **C# executes the current AGG-01 checks; OKF organises the approved knowledge that explains\nand supports them.** This describes the current implementation, not a requirement that every future\nbusiness rule must remain compiled C#.\n\n**Current state: BUILT.** The knowledge compiler validates and packages versioned OKF documents,\nvendor constraints, equipment information and source references. It does not generate executable C#\nrule bodies. Changes to current executable logic require code review, regression tests and an\napplication release, not just approval of a revised manual. Source-object references connect results\nto supporting knowledge; they are not executable rule compilation.\n\nC# does not require OKF to execute rules. The governed AGG-01 path deliberately requires approved\nknowledge as an application control, with these separate responsibilities:\n\n| Concern | Responsible component |\n|---|---|\n| Current equipment facts | NCTSite/Oracle and their governed interfaces |\n| Executable checks and engineering decision | C# rules |\n| Requirement, vendor clause and supporting source | OKF objects and references |\n| Approved version, integrity and execution pin | Registry and validation code operating on the bundle |\n\nApproval and integrity checks are enforced by application code, not by the format alone. A source ID\nor matching hash does not prove that C# agrees with the documented requirement (Q6). The justification\nfor OKF is governance and traceability, not automatic rule generation or a need to send the full OKF\ntext to the explanation model. Simpler alternatives are in Q28; implementation evidence is in Appendix B2.\n\n**Target / remaining gap: DESIGNED for general declarative execution.** The rules-as-data plan supports\na selective, controlled declarative layer for frequently changing vendor/business conditions where\njustified. This needs machine-evaluable predicates, SME validation, versioning, approval, regression\ncoverage and compatible release/rollback controls. Prose does not become executable by packaging it\nas OKF. Procedural checks can remain C#; safety invariants, authorisation and write restrictions must\nremain enforced by code/policy independently of declarative content or LLM output. The plan is not\nevidence that all current rules already run as data.","sha256":"4f0a76fc49e4d096d0a41d081dfd58d13f727e9487d6e0836761fb2d46747b2f"},"textDiagram":"[n1] NCTSite / Oracle [CURRENT]\n  +-- δεδομένα --> [n2] Κανόνες C# [BUILT]\n  |   +-- έλεγχοι --> [n3] Απόφαση AGG-01 [BUILT]\n\n[n4] Έγκριση και έκδοση [BUILT]\n  +-- εγκρίνει --> [n5] OKF bundle [BUILT]\n  |   +-- τεκμήρια --> [n2] Κανόνες C# [BUILT] (αναφορά)\n\n[n6] Rules-as-data [DESIGNED]\n  +-- μελλοντικά / στόχος --> [n5] OKF bundle [BUILT] (αναφορά)"},{"question":5,"slug":"q05-knowledge-release","title":"Από εγχειρίδιο σε έκδοση γνώσης","summary":"Η προτεινόμενη διαδρομή έγκρισης διαχωρίζει προτάσεις γνώσης από εξουσιοδοτημένη ενεργοποίηση.","nodes":[{"id":"n1","label":"Πηγή και αναθεώρηση","detail":"Αμετάβλητο αρχείο","status":"MANUAL","type":"external","slot":0},{"id":"n2","label":"Υποψήφια γνώση","detail":"Εξαγωγή / ερμηνεία","status":"ASSISTED","type":"backend","slot":1},{"id":"n3","label":"OKF και δοκιμές","detail":"Πακέτο / Golden Set","status":"BUILT","type":"database","slot":2},{"id":"n4","label":"Επιθεώρηση SME","detail":"Ανθρώπινη έγκριση","status":"MANUAL","type":"security","slot":3},{"id":"n5","label":"UAT και ενεργοποίηση","detail":"Προώθηση μεταξύ περιβαλλόντων","status":"DESIGNED","type":"backend","slot":4},{"id":"n6","label":"Εκτέλεση με pin","detail":"Δέσμευση εγκεκριμένης έκδοσης","status":"DEV","type":"backend","slot":5}],"edges":[{"from":"n1","to":"n2","label":"πρόταση","target":true},{"from":"n2","to":"n3","label":"επικύρωση","target":false},{"from":"n3","to":"n4","label":"έλεγχος","target":false},{"from":"n4","to":"n5","label":"έγκριση","target":true},{"from":"n5","to":"n6","label":"ίδια έκδοση","target":true}],"notes":["Η συνολική αυτοματοποιημένη ροή PDF-to-production (από αρχείο σε παραγωγή) δεν έχει αποδειχθεί.","Υπάρχει ενεργή εγκεκριμένη έκδοση στην ανάπτυξη. Η επιθεώρηση SME (ειδικού πεδίου) παραμένει χειροκίνητη.","Αλλαγή λογικής κανόνα απαιτεί και χωριστή έκδοση C#, όχι μόνο νέο OKF.","1-3 εργάσιμες ημέρες ή μία εβδομάδα και άνω είναι ενδεικτικές εκτιμήσεις, όχι SLA (συμφωνία επιπέδου υπηρεσίας)."],"geometry":{"edge3":{"labelAt":[1095,280]}},"source":{"title":"New/revised vendor manual → approved Production knowledge/OKF","body":"**Answer.** The target lifecycle is versioned: register the source and revision, retain an immutable\nsource artifact, extract and normalise content, propose knowledge changes, analyse their impact, build\na candidate OKF bundle, validate schema and references, build retrieval projections, run Golden Set\nregression, obtain SME review and an approval record, validate in UAT, then promote to Production.\nAI-assisted extraction produces proposals, never approvals. Production policy requires approved\nsources before activation in the trusted knowledge set.\n\n**Partially BUILT:** OKF authoring and knowledge compilation, AGG-01 Golden Set regression, and the\nauthority-release mechanism that binds an execution to an approved knowledge version. An Active release\nis recorded in the development database (`CONFIG.md`, \"PoTP authoritative knowledge pinning\").\nSME review remains manual and out of band; this is not evidence of a completed automated\nDEV-to-UAT-to-Production release.\n\nKnowledge compilation here means validated knowledge packaging and projections, not generation of\nexecutable C# rules. When a manual revision changes implemented rule logic, a separate code change,\nregression suite and approved application release are required alongside the knowledge release (Q4).\n\nThe additional response proposes separate Knowledge Author and Policy Reviewer responsibilities;\nthis separation of duties should be an acceptance requirement, not inferred from role names alone.\nIts XDOM-01 OCR/manual-ingestion sequence is a target integration, not evidence of a completed\nPDF-to-production pipeline. The suggested 1–3 working days for a familiar equipment family, or a week\nor more for a new structure, is an indicative estimate requiring SME availability, extraction quality,\ntest coverage and any necessary C# change to be assessed. It is not a delivery SLA.","sha256":"aea401c3192985f6148eca5cd33a578eb3a03657073a7d82eaf8f1ac0cc69bdc"},"textDiagram":"[n1] Πηγή και αναθεώρηση [MANUAL]\n  +-- πρόταση / στόχος --> [n2] Υποψήφια γνώση [ASSISTED]\n  |   +-- επικύρωση --> [n3] OKF και δοκιμές [BUILT]\n  |   |   +-- έλεγχος --> [n4] Επιθεώρηση SME [MANUAL]\n  |   |   |   +-- έγκριση / στόχος --> [n5] UAT και ενεργοποίηση [DESIGNED]\n  |   |   |   |   +-- ίδια έκδοση / στόχος --> [n6] Εκτέλεση με pin [DEV]"},{"question":6,"slug":"q06-impact-and-drift","title":"Επίδραση αλλαγής και σημασιολογική απόκλιση","summary":"Οι σύνδεσμοι πηγής, κανόνα και δοκιμής στηρίζουν έλεγχο συνέπειας, χωρίς να αποδεικνύουν αυτόματα ισοδυναμία νοήματος.","nodes":[{"id":"n1","label":"Ρήτρα πηγής","detail":"Απαίτηση προμηθευτή","status":"MANUAL","type":"external","slot":0},{"id":"n2","label":"Αντικείμενο OKF","detail":"Παραπομπή και έκδοση","status":"BUILT","type":"database","slot":1},{"id":"n3","label":"Κανόνας C#","detail":"Εκτελέσιμη ερμηνεία","status":"BUILT","type":"backend","slot":2},{"id":"n4","label":"Δοκιμή αποδοχής","detail":"Αναμενόμενο αποτέλεσμα SME","status":"REQUIRED","type":"security","slot":3},{"id":"n5","label":"Συντονισμένη έκδοση","detail":"Γνώση και εφαρμογή μαζί","status":"REQUIRED","type":"backend","slot":4},{"id":"n6","label":"Impact Set","detail":"Πλήρες σύνολο επιπτώσεων","status":"DESIGNED","type":"backend","slot":5}],"edges":[{"from":"n1","to":"n2","label":"τεκμηρίωση","target":false},{"from":"n2","to":"n3","label":"αντιστοίχιση","target":false},{"from":"n3","to":"n4","label":"ελέγχεται","target":false},{"from":"n4","to":"n5","label":"αποδοχή","target":true},{"from":"n6","to":"n5","label":"αποτίμηση","target":true}],"notes":["BUILT (υλοποιημένο): εργαλεία επικύρωσης OKF και Golden Set (σύνολο αναφοράς), όχι πλήρης αυτόματη ανάλυση επιπτώσεων.","Semantic drift (σημασιολογική απόκλιση): αλλάζει η τεκμηρίωση χωρίς τον κανόνα ή ο κανόνας χωρίς τη γνώση.","Προτεινόμενοι έλεγχοι: σαφής αντιστοίχιση, αναμενόμενα αποτελέσματα SME και διάκριση αλλαγής κειμένου από αλλαγή συμπεριφοράς.","Οι προτάσεις LLM δεν υποκαθιστούν έγκριση και δεν είναι δυνατότητα της σημερινής κλήσης εξήγησης AGG-01."],"geometry":{"edge3":{"labelAt":[1095,280]}},"source":{"title":"Automated / AI-assisted / manual steps, and impact detection","body":"**Answer.** The automation boundary must distinguish available tooling from the complete target flow.\n\n| Step | Current position |\n|---|---|\n| OKF validation/packaging and AGG-01 Golden Set regression | **BUILT** tooling; see Q4–Q5 |\n| Source registration, engineering interpretation, SME approval and release authorisation | Manual governance responsibilities |\n| Extraction of proposed knowledge, semantic comparison, contradiction analysis and proposed test cases | AI-assisted authoring activities, not an autonomous approved ingestion service |\n| Complete source-revision detection, impact analysis, projection rebuild and cross-environment promotion | **DESIGNED** as an end-to-end automated flow; individual components do not prove the whole flow |\n| Executable rule changes | C# implementation and release today; general declarative rule compilation remains **DESIGNED** |\n| Artifact signing and signature verification in a release | Mechanisms exist; successful release execution is not yet evidenced (Q12, Q26) |\n\nThe proposed lineage graph links source clause, OKF object, executable rule, agent, bundle, Golden test\ncase and retrieval projection in both directions. Automatically deriving a complete Impact Set from a\nmanual revision remains **DESIGNED**. Today an author uses bundle cross-references and code/test\ndependencies to assess the impact. An AI-produced proposal never replaces engineering approval.\n\nThe main consistency risk is semantic drift: an OKF requirement can change without the C# rule\nchanging, or vice versa. Proposed controls are an explicit source-clause → OKF object → C# rule →\ntest mapping; SME-approved expected outcomes in shared acceptance tests; classification of each\nrevision as documentation-only or behaviour-changing; and coordinated knowledge/code review and\nrelease for the latter. IDs, hashes and graph links support that review but do not establish semantic\nequivalence. Full automatic knowledge-to-code equivalence checking is not claimed.\n\nLLM-assisted comparison of manuals, extraction of candidate requirements and identification of\nambiguities are useful development directions. Each needs a separately implemented and evaluated\nscenario path; none is an implicit capability of today's AGG-01 explanation call.","sha256":"f28f446524f3e7400bf0937fbd0b572e9549b9cb371840bf9e908a0727b2fdf7"},"textDiagram":"[n1] Ρήτρα πηγής [MANUAL]\n  +-- τεκμηρίωση --> [n2] Αντικείμενο OKF [BUILT]\n  |   +-- αντιστοίχιση --> [n3] Κανόνας C# [BUILT]\n  |   |   +-- ελέγχεται --> [n4] Δοκιμή αποδοχής [REQUIRED]\n  |   |   |   +-- αποδοχή / στόχος --> [n5] Συντονισμένη έκδοση [REQUIRED]\n\n[n6] Impact Set [DESIGNED]\n  +-- αποτίμηση / στόχος --> [n5] Συντονισμένη έκδοση [REQUIRED] (αναφορά)"},{"question":7,"slug":"q07-llm-and-human","title":"Ρόλοι LLM και ανθρώπινη έγκριση","summary":"Η βασική απόφαση AGG-01 δεν χρειάζεται LLM. Οι υλοποιημένες χρήσεις μοντέλου έχουν διαφορετικά όρια.","nodes":[{"id":"n1","label":"Δεδομένα και C#","detail":"Βασική απόφαση AGG-01","status":"BUILT","type":"backend","slot":0},{"id":"n2","label":"Απόφαση κανόνων","detail":"Χωρίς εκτέλεση LLM","status":"BUILT","type":"frontend","slot":1},{"id":"n3","label":"Προαιρετική εξήγηση","detail":"Μόνο ασαφές αποτέλεσμα","status":"GATED","type":"backend","slot":2},{"id":"n4","label":"Ανθρώπινη έγκριση","detail":"Δεν χορηγείται από LLM","status":"REQUIRED","type":"security","slot":3},{"id":"n5","label":"Verify με μοντέλο","detail":"REJECT / NO-OBJECTION","status":"BUILT","type":"backend","slot":4},{"id":"n6","label":"Γενική συνομιλία","detail":"Σύνθεση / προτάσεις εργαλείων","status":"BUILT","type":"frontend","slot":5}],"edges":[{"from":"n1","to":"n2","label":"αξιολόγηση","target":false},{"from":"n2","to":"n3","label":"διατύπωση","target":false},{"from":"n5","to":"n4","label":"δεν εγκρίνει","target":false},{"from":"n3","to":"n4","label":"δεν εγκρίνει","target":false}],"notes":["Και οι δύο AllowModelFallback (ρυθμίσεις άδειας μοντέλου) πρέπει να επιτρέπουν την κλήση για ClarificationRequired ή InsufficientEvidence.","Το μοντέλο δεν αλλάζει απόφαση, βεβαιότητα ή τεκμήρια. Αποτυχία εξήγησης αφήνει τη διατύπωση κανόνων, εκτός ρητής ακύρωσης.","Το Verify (βήμα εξέτασης) μπορεί να απορρίψει ή να αποτύχει, όχι να χορηγήσει ανθρώπινη έγκριση. Οι δύο χρήσεις δεν αποτελούν υποχρεωτική ενιαία ροή.","Δεν υπάρχει αυτόματη εκπαίδευση από συνομιλίες. Ο πλήρης κύκλος ανατροφοδότησης παραμένει DESIGNED (σχεδιασμένος)."],"geometry":{"edge4":{"labelAt":[1095,280]}},"source":{"title":"\"Training/improvement\" process and Human-in-the-Loop","body":"**Answer.** The baseline architecture does not require continuous training or fine-tuning of the\nfoundation LLM. The improvement loop runs: production execution → engineer feedback/rejection →\nanalysis/clustering → candidate improvement (to knowledge, rules, prompt/policy, routing, Golden Set,\nor retrieval configuration) → UAT regression → SME approval → controlled Production release. Model\nfine-tuning is not part of the baseline lifecycle; it could be evaluated in the future for a narrowly\ndefined need, but would be treated as a separate model-development process with its own approved\ntraining dataset, privacy/security review, lineage, validation, versioning, UAT testing, approval and\nrollback plan — there is no \"the model learns automatically from chats\" behaviour. Human-in-the-Loop\ngoverns approval of knowledge/rule changes, ambiguous technical interpretation, high-risk\nrecommendations, release gates, write/action workflows and exception handling. **BUILT** as an\narchitectural constraint (no code path for online learning exists in `src/NCT.AI.Models` or\n`src/NCT.AI.Runtime`); the end-to-end feedback tooling remains **DESIGNED**.\n\nNo online learning does **not** mean identical model output on Day 1 and Day 400. Model inference is\nalso distinct from training. Its implemented roles differ by path:\n\n| Path | Model role and limit | Current position |\n|---|---|---|\n| AGG-01 engineering decision | None: C# evaluates the facts and rules | The core decision needs no LLM inference |\n| AGG-01 optional explanation | Rewords an already inconclusive result; cannot change decision, confidence or evidence | Implemented, gated by both request and use-case configuration |\n| General chat | Synthesises the prompt, selected history and retrieved context; proposes available tool calls within bounded rounds | Implemented; activation and tools depend on configuration |\n| Plan `Verify` step | Reviews prior artifacts and returns `REJECT` or `NO-OBJECTION` | Implemented; can block continuation, but cannot grant human approval |\n\nIn AGG-01, both `AllowModelFallback` settings must permit the call, and the rule result must be\n`ClarificationRequired` or `InsufficientEvidence`. This fallback is for wording, **not a replacement\ndecision when a rule is missing**. If model generation fails or its wording is rejected, the rule-derived\nexplanation remains; explicit caller cancellation still cancels the operation. For example, a slot\nreserved by a previous Work Order remains a clarification case; a model cannot waive the reservation.\nFixed response templates may suffice for this function, so any model benefit must be measured (Q21).\n\nIn a configured `Verify` step, rejection can decisively stop the flow. An unavailable, truncated or\nunparseable verdict fails the step rather than passing unchecked. `NO-OBJECTION` is neither proof of\ncorrectness nor an engineer's approval. The verifier has no Oracle/NCTSite tools; chat tool proposals\nlikewise grant no extra permissions. These are implemented paths, not evidence that every request or\nenvironment uses them. Implementation evidence is in Appendix B3.\n\nA two-person approval requirement must specify the action and enforce distinct authenticated\nidentities; it must not be presented as a proven check on every read-only answer simply because\nengineer approval gates exist. **C# enforces the specified checks; the LLM helps interpret, synthesise\nand communicate information without replacing those checks or human approval.**","sha256":"a235036fc9bc011d70dcb75ff374b451d44a0f763e32d20500d637f49cf3bccf"},"textDiagram":"[n1] Δεδομένα και C# [BUILT]\n  +-- αξιολόγηση --> [n2] Απόφαση κανόνων [BUILT]\n  |   +-- διατύπωση --> [n3] Προαιρετική εξήγηση [GATED]\n  |   |   +-- δεν εγκρίνει --> [n4] Ανθρώπινη έγκριση [REQUIRED]\n\n[n5] Verify με μοντέλο [BUILT]\n  +-- δεν εγκρίνει --> [n4] Ανθρώπινη έγκριση [REQUIRED] (αναφορά)\n\n[n6] Γενική συνομιλία [BUILT]"},{"question":8,"slug":"q08-feedback","title":"Ανατροφοδότηση και νέες δοκιμές","summary":"Η δομημένη ανατροφοδότηση είναι απαίτηση σχεδιασμού· μεμονωμένα ίχνη απόρριψης δεν συνιστούν ολοκληρωμένο σύστημα βελτίωσης.","nodes":[{"id":"n1","label":"Απόρριψη μηχανικού","detail":"Πηγή προβλήματος","status":"INPUT","type":"external","slot":0},{"id":"n2","label":"Δομημένο feedback","detail":"Συμβάν ανατροφοδότησης","status":"DESIGNED","type":"database","slot":1},{"id":"n3","label":"Clustering","detail":"Ομαδοποίηση απορρίψεων","status":"DESIGNED","type":"backend","slot":2},{"id":"n4","label":"Αναπαραγωγή σφάλματος","detail":"Σωστό αποτέλεσμα SME","status":"REQUIRED","type":"security","slot":3},{"id":"n5","label":"Golden Set","detail":"Δοκιμές μη παλινδρόμησης","status":"BUILT","type":"backend","slot":4},{"id":"n6","label":"Εγκεκριμένη διόρθωση","detail":"Κώδικας / γνώση / prompt","status":"REQUIRED","type":"security","slot":5}],"edges":[{"from":"n1","to":"n2","label":"καταγραφή","target":true},{"from":"n2","to":"n3","label":"ανάλυση","target":true},{"from":"n3","to":"n4","label":"διερεύνηση","target":true},{"from":"n4","to":"n5","label":"νέα δοκιμή","target":true},{"from":"n5","to":"n6","label":"αποδοχή","target":true}],"notes":["Golden Set (σύνολο αναφοράς): BUILT (υλοποιημένο) για AGG-01.","Η πλήρης μόνιμη καταγραφή και η ομαδοποίηση δεν τεκμηριώνονται ως λειτουργική ενιαία διαδρομή.","Ανάλυση και υποψήφια πρόταση δεν εξουσιοδοτούν παραγωγική ενεργοποίηση.","Αλλαγές αποτελέσματος χρειάζονται SME/Knowledge Approver (ειδικό/εγκριτή γνώσης) και χωριστούς ελέγχους έκδοσης C#."],"geometry":{"edge3":{"labelAt":[1095,280]}},"source":{"title":"Rejection clustering, Golden Set expansion, and mandatory SME approval","body":"**Answer.** Engineer feedback should be captured as a structured feedback event, linked to the\nrecommendation, evidence and relevant versions. Rejection clustering would then group similar failures\nto identify systemic issues. This is the intended improvement process, not a claim that a persistent,\nend-to-end feedback capture and analytics pipeline is operational.\n\n**Current state.** Golden Set regression is **BUILT** for AGG-01. Individual approval/rejection audit\nrecords do not establish a general feedback entity/API or a complete feedback loop. End-to-end\nfeedback tooling and rejection clustering remain **DESIGNED** (Q7; Appendix B2).\n\n**Target / remaining gap.** A confirmed failure should become a reproducible regression case:\nreproduce, determine the correct expected outcome, extend the Golden Set, fix the rule/knowledge/prompt\nand prove that the regression passes. Feedback is triage evidence, never a direct conversion into\nProduction rules. Analytics and draft candidates do not themselves authorise Production activation.\nAny change to Production knowledge or rules that can alter an engineering outcome requires\nSME/Knowledge Approver approval before activation. Q5 governs knowledge releases; executable C#\nchanges also require the separate code-review, regression and application-release controls in Q4/Q12.","sha256":"4f03db100b87df76e219d0162ef398b410fc273dc868629f74f26c0413d02e06"},"textDiagram":"[n1] Απόρριψη μηχανικού [INPUT]\n  +-- καταγραφή / στόχος --> [n2] Δομημένο feedback [DESIGNED]\n  |   +-- ανάλυση / στόχος --> [n3] Clustering [DESIGNED]\n  |   |   +-- διερεύνηση / στόχος --> [n4] Αναπαραγωγή σφάλματος [REQUIRED]\n  |   |   |   +-- νέα δοκιμή / στόχος --> [n5] Golden Set [BUILT]\n  |   |   |   |   +-- αποδοχή / στόχος --> [n6] Εγκεκριμένη διόρθωση [REQUIRED]"},{"question":9,"slug":"q09-promotion","title":"Ελεγχόμενη προώθηση παραδοτέων","summary":"Η διαδρομή στόχου προωθεί το ίδιο εγκεκριμένο παραδοτέο από DEV σε UAT και παραγωγή, χωρίς αυτόματη μάθηση.","nodes":[{"id":"n1","label":"DEV κατασκευή","detail":"Εφαρμογή / κανόνες / γνώση","status":"PARTIAL","type":"backend","slot":0},{"id":"n2","label":"Αμετάβλητη υποψήφια","detail":"Εκδόσεις και αποτυπώματα","status":"DESIGNED","type":"database","slot":1},{"id":"n3","label":"UAT αποδοχή","detail":"Δοκιμές / ασφάλεια / SME","status":"DESIGNED","type":"security","slot":2},{"id":"n4","label":"Release manifest","detail":"Μητρώο εγκεκριμένης έκδοσης","status":"DESIGNED","type":"database","slot":3},{"id":"n5","label":"Παραγωγή","detail":"Ίδια εγκεκριμένα παραδοτέα","status":"DESIGNED","type":"cloud","slot":4},{"id":"n6","label":"Ανατροφοδότηση","detail":"Νέα υποψήφια, όχι αυτομάθηση","status":"DESIGNED","type":"external","slot":5}],"edges":[{"from":"n1","to":"n2","label":"δέσμευση","target":true},{"from":"n2","to":"n3","label":"δοκιμές","target":true},{"from":"n3","to":"n4","label":"έγκριση","target":true},{"from":"n4","to":"n5","label":"προώθηση","target":true},{"from":"n5","to":"n6","label":"παρατηρήσεις","target":true}],"notes":["BUILT (υλοποιημένο): ενεργοποίηση εγκεκριμένης γνώσης και pinning (δέσμευση έκδοσης) στην ανάπτυξη.","End-to-end promotion (ολοκληρωμένη προώθηση) στην παραγωγή παραμένει DESIGNED (σχεδιασμένη).","Κανόνες C# ακολουθούν την εφαρμογή. Embeddings (διανυσματικές αναπαραστάσεις) απαιτούν ίδιο source bundle, chunking, μοντέλο και manifest (πηγή, τμηματοποίηση, μητρώο).","Ίδιο hash πηγής δεν σημαίνει ίδια bytes embeddings. Η πολιτική αναβάθμισης παρόχου ελέγχεται χωριστά."],"geometry":{"edge3":{"labelAt":[1095,280]}},"source":{"title":"Promotion of model versions, rules, knowledge and embeddings between UAT/Production, and \"learning\" transfer","body":"**Answer.** The target promotion process is artifact-based and immutable, across application images,\nagent definitions, prompt templates, policy versions, executable rule code, approved OKF bundles,\nembedding-model configuration, vector-index manifests and model-routing configuration: build once,\npromote the same approved artifact\nthrough DEV → candidate → UAT (regression, security tests, SME acceptance) → an approved release\nmanifest → Production, never rebuilding a \"similar\" bundle from source once UAT has validated it.\nEmbeddings may be physically regenerated per environment but must derive from the same approved\nsource bundle, chunking version, embedding-model version and projection manifest, ideally built\nside-by-side and switched via an alias after validation. Model changes are configuration-controlled,\nbut provider-side upgrade policy must be governed separately (Q21; Appendix B4). There is no direct,\nautomatic \"Production learns and updates itself\" path — Production telemetry/feedback can inform a\nUAT/DEV candidate, but only through the governed regression-and-approval lifecycle in Q7–Q8, in one\ndirection, human-gated at release approval. **BUILT** for knowledge authority activation and pinning in\ndevelopment (Q5); this is not proof of cross-environment promotion. End-to-end Production promotion,\nincluding model configuration and executable rule/application releases, remains **DESIGNED** and\nunverified. Current C# rules are promoted with the application, not by an independent OKF alias.\n\nAn equal source-bundle hash does not by itself prove equal embedding bytes. Re-projection also depends\non preprocessing, chunking, model/version and service behaviour. Record the projection manifest and\nvalidate retrieval quality; retain exact artifacts where byte-for-byte reproducibility is required.","sha256":"738b2ba24480103fb6d26afb64789851aa836cb2a66b8dac50d673cc5e6127e2"},"textDiagram":"[n1] DEV κατασκευή [PARTIAL]\n  +-- δέσμευση / στόχος --> [n2] Αμετάβλητη υποψήφια [DESIGNED]\n  |   +-- δοκιμές / στόχος --> [n3] UAT αποδοχή [DESIGNED]\n  |   |   +-- έγκριση / στόχος --> [n4] Release manifest [DESIGNED]\n  |   |   |   +-- προώθηση / στόχος --> [n5] Παραγωγή [DESIGNED]\n  |   |   |   |   +-- παρατηρήσεις / στόχος --> [n6] Ανατροφοδότηση [DESIGNED]"},{"question":10,"slug":"q10-intent-routing","title":"Πρόθεση, πράκτορας και επιτρεπόμενη γνώση","summary":"Η σημερινή δρομολόγηση είναι ντετερμινιστική αντιστοίχιση φράσεων, όχι ταξινόμηση από LLM.","nodes":[{"id":"n1","label":"Αίτημα χρήστη","detail":"Ή ρητή επιλογή πράκτορα","status":"INPUT","type":"frontend","slot":0},{"id":"n2","label":"Intent router","detail":"Δρομολογητής φράσεων","status":"BUILT","type":"backend","slot":1},{"id":"n3","label":"Έλεγχος πρόσβασης","detail":"Υπαρκτός / ενεργός / ρόλοι","status":"BUILT","type":"security","slot":2},{"id":"n4","label":"Agent και σχέδιο","detail":"Δηλωμένες συνταγές","status":"BUILT","type":"backend","slot":3},{"id":"n5","label":"Επιτρεπόμενη γνώση","detail":"Bundle και δικαιώματα εργαλείων","status":"BUILT","type":"database","slot":4},{"id":"n6","label":"Αποτυχία διαδρομής","detail":"No-match / άρνηση πρόσβασης","status":"BUILT","type":"external","slot":5}],"edges":[{"from":"n1","to":"n2","label":"φράσεις","target":false},{"from":"n2","to":"n3","label":"υποψήφιος","target":false},{"from":"n3","to":"n4","label":"επιτρέπεται","target":false},{"from":"n4","to":"n5","label":"όρια","target":false},{"from":"n2","to":"n6","label":"δεν βρέθηκε","target":false}],"notes":["Ρητή επιλογή πράκτορα παρακάμπτει τον εντοπισμό πρόθεσης, όχι ελέγχους ύπαρξης, ενεργοποίησης και ρόλων.","Επικαλυπτόμενες φράσεις: πρώτη αντιστοίχιση. Δεν υπάρχει ανιχνευτής ασάφειας βάσει βεβαιότητας.","ROUTE_NO_MATCHING_INTENT δεν είναι InsufficientEvidence (ανεπαρκή τεκμήρια ήδη επιλεγμένου πράκτορα).","Διπλότυπες δηλωμένες προθέσεις απορρίπτονται στη φόρτωση. Μεταγενέστερο Verify δεν κάνει τον planner (σχεδιαστή) LLM-driven (καθοδηγούμενο από μοντέλο)."],"geometry":{"edge3":{"labelAt":[1095,280]}},"source":{"title":"Intent → Agent → allowed Knowledge Bundle mapping; ambiguous/no-match requests","body":"**Answer.** **BUILT:** manifests declare agent intents, roles and capabilities; deployment configuration\nand knowledge authority constrain which providers and approved knowledge an execution can use. The\ncaller cannot grant itself a different corpus or extra tool permissions. Duplicate declared intents\nare rejected when loading manifests (`CONFIG.md`, \"the open agent set\").\n\nThe current intent router performs deterministic phrase matching, not LLM classification. An\nexplicit agent choice skips intent inference but still checks whether the agent exists, is enabled\nand permits the caller's roles. No match returns `ROUTE_NO_MATCHING_INTENT`; missing, disabled and\nforbidden agents have separate routing outcomes. The plan builder then uses declared recipes without\na model call. Implementation evidence is in Appendix B3.\n\nOverlapping phrase groups currently use the first match in configured order. That is distinct from a\nduplicate manifest intent and is not a confidence-based ambiguity detector. Targeted clarification for\nsuch ambiguity remains a design/acceptance requirement. A routing failure is also different from an\nagent's `InsufficientEvidence` result after it has been selected; the two must not be conflated.\n\nA later model-backed `Verify` step does not make the planner model-driven. Similarly, a chat model's\ntool selection is not the registry's intent-routing algorithm. A conversational interface or multiple\nagents alone is not evidence of LLM-based planning or routing (Q7).","sha256":"d4934eee6d7808c161242f9fe20be033b18506ae13aeb920d2edff4157a16e92"},"textDiagram":"[n1] Αίτημα χρήστη [INPUT]\n  +-- φράσεις --> [n2] Intent router [BUILT]\n  |   +-- υποψήφιος --> [n3] Έλεγχος πρόσβασης [BUILT]\n  |   |   +-- επιτρέπεται --> [n4] Agent και σχέδιο [BUILT]\n  |   |   |   +-- όρια --> [n5] Επιτρεπόμενη γνώση [BUILT]\n  |   +-- δεν βρέθηκε --> [n6] Αποτυχία διαδρομής [BUILT]"},{"question":11,"slug":"q11-user-interface","title":"Ανεξάρτητη διεπαφή και NCTSite","summary":"Η σημερινή εφαρμογή AG-UI είναι ανεξάρτητη. Σύνδεσμος από NCTSite ή ενσωμάτωση είναι χωριστή μελλοντική επιλογή.","nodes":[{"id":"n1","label":"Μηχανικός","detail":"Πιστοποιημένος χρήστης","status":"CURRENT","type":"external","slot":0},{"id":"n2","label":"AG-UI / Entra ID","detail":"Ανεξάρτητο Blazor Server","status":"BUILT","type":"frontend","slot":1},{"id":"n3","label":"NCT-AI BFF / APIs","detail":"Συμβάσεις διεπαφής","status":"BUILT","type":"backend","slot":2},{"id":"n4","label":"Έλεγχος ενσωμάτωσης","detail":"SSO / CSP / δικαιώματα","status":"REQUIRED","type":"security","slot":3},{"id":"n5","label":"Deep link / context","detail":"Σύνδεσμος με πλαίσιο οντότητας","status":"DESIGNED","type":"frontend","slot":4},{"id":"n6","label":"NCTSite σελίδα","detail":"Καμία σημερινή σύνδεση AI","status":"CURRENT","type":"external","slot":5}],"edges":[{"from":"n1","to":"n2","label":"είσοδος","target":false},{"from":"n2","to":"n3","label":"αιτήματα","target":false},{"from":"n6","to":"n5","label":"μελλοντικά","target":true},{"from":"n5","to":"n4","label":"έλεγχος","target":true}],"notes":["BUILT (υλοποιημένο): Blazor Server και MudBlazor με ξεχωριστή σύνδεση Entra ID, όχι ενσωματωμένο τμήμα NCTSite.","DESIGNED (σχεδιασμένο): μενού/deep link (απευθείας σύνδεσμος), context passing (μεταφορά πλαισίου), προαιρετικό embedded component (ενσωματωμένο συστατικό).","Ο πελάτης αποφασίζει τελική εμπειρία. Χρειάζονται έλεγχοι SSO/session (ενιαίας σύνδεσης/συνεδρίας), CSP (πολιτικής ασφάλειας περιεχομένου) και κύκλου υποστήριξης.","Το υποτιθέμενο χαμηλό κόστος ενσωμάτωσης δεν είναι εκτιμημένη δέσμευση."],"geometry":{},"source":{"title":"Dedicated GUI vs embedding into the existing NCTSite UI","body":"**Answer.** **BUILT, as a dedicated application.** NCT-AI's AG-UI is a separate Blazor Server web\napplication with its own Entra ID sign-in (app registration `NCT`), not an embedded component inside\nNCTSite — this describes the implemented baseline, not a restriction on the customer's final UX choice:\n`nct-ai-technology-choices.md` §1 records \"UI: Blazor\nServer + MudBlazor, rejecting a React/Angular SPA embedded in NCTSite\" specifically to keep one language\nacross the stack and typed component contracts rather than model-generated HTML inside an existing\npage. The recommended phased model keeps Phase 1 as the dedicated NCT-AI UI talking to the NCT-AI\nBFF/APIs directly — faster independent delivery, an independent release lifecycle, a clean security\nboundary, and room to experiment with AI-specific UX (chat, approvals, traces, recommendation views) —\nwith Phase 2 integrating into NCTSite via menu/deep link, context passing, SSO, entity ids, and\noptionally an embedded component/micro-frontend if NCTSite allows it (e.g. an \"Ask NCT-AI\" action on an\nNCTSite equipment page opening NCT-AI pre-scoped to that equipment/context id). The recommendation is\nnot to couple the AI frontend's lifecycle tightly to the NCTSite monolith from the start; deep-linking\nfrom NCTSite into a specific NCT-AI context is **DESIGNED**, not built — no NCTSite page currently links\nout to NCT-AI. The customer can still choose the final access experience. A link with approved context\npassing is different from an embedded panel: embedding requires SSO/session, framing/CSP, authorisation\nand support-lifecycle review. The source's \"practically inexpensive\" description is not an assessed\nimplementation estimate.","sha256":"ae148ac50a0f088a24813607d518f7334e6cb12481c0d1f752a7126689fa8766"},"textDiagram":"[n1] Μηχανικός [CURRENT]\n  +-- είσοδος --> [n2] AG-UI / Entra ID [BUILT]\n  |   +-- αιτήματα --> [n3] NCT-AI BFF / APIs [BUILT]\n\n[n6] NCTSite σελίδα [CURRENT]\n  +-- μελλοντικά / στόχος --> [n5] Deep link / context [DESIGNED]\n  |   +-- έλεγχος / στόχος --> [n4] Έλεγχος ενσωμάτωσης [REQUIRED]"},{"question":12,"slug":"q12-delivery","title":"Από CI σε ελεγχόμενη παραγωγή","summary":"Οι έλεγχοι CI δεν ισοδυναμούν με επιτυχή, υπογεγραμμένη και εγκεκριμένη παραγωγική διάθεση.","nodes":[{"id":"n1","label":"CI: build / tests","detail":"Κατασκευή και δοκιμές","status":"BUILT","type":"backend","slot":0},{"id":"n2","label":"Υπογραφή εικόνων","detail":"Επιτυχής έκδοση μη αποδεδειγμένη","status":"BLOCKED","type":"security","slot":1},{"id":"n3","label":"DEV εγκατάσταση","detail":"AKS ανάπτυξης έχει λειτουργήσει","status":"DEV","type":"cloud","slot":2},{"id":"n4","label":"UAT αποδοχή","detail":"Ασφάλεια / απόδοση / επιχείρηση","status":"DESIGNED","type":"security","slot":3},{"id":"n5","label":"Έγκριση παραγωγής","detail":"Υποχρεωτική πύλη επιβολής","status":"PENDING","type":"security","slot":4},{"id":"n6","label":"Παραγωγική διάθεση","detail":"Επαλήθευση και επαναφορά","status":"DESIGNED","type":"cloud","slot":5}],"edges":[{"from":"n1","to":"n2","label":"παραδοτέα","target":true},{"from":"n2","to":"n3","label":"διάθεση","target":true},{"from":"n3","to":"n4","label":"επικύρωση","target":true},{"from":"n4","to":"n5","label":"αποδοχή","target":true},{"from":"n5","to":"n6","label":"εξουσιοδότηση","target":true}],"notes":["Το διάγραμμα δείχνει τη διαδρομή στόχου. Οι παρατηρημένες χειροκίνητες εγκαταστάσεις DEV δεν αποδεικνύουν ολοκλήρωσή της.","images-signed και signatures-verified (υπογεγραμμένες εικόνες/επαληθευμένες υπογραφές) παραμένουν blocked (μπλοκαρισμένα).","Release manifest (μητρώο έκδοσης): εφαρμογή, κανόνες, γνώση, μοντέλα, μεταβολές σχήματος, τεκμήρια και αναφορές επαναφοράς.","Η παραγωγική έγκριση χρειάζεται επιβολή πριν ενεργοποιηθούν διαπιστευτήρια εγκατάστασης. Τα εργαλεία CI/CD επιλέγονται με Telekom."],"geometry":{"edge3":{"labelAt":[1095,280]}},"source":{"title":"Target CI/CD and deployment model; manual steps; release launch process","body":"**Answer.** Delivery requires validated, signed artifacts, UAT acceptance, explicit Production\nauthorisation and post-deployment verification. CI mechanisms alone do not prove a completed release.\n\n**Current state.** Build/test and security workflows exist; development AKS deployments are recorded.\nImage-signing/verification mechanisms exist, but successful release evidence is still blocked.\nDevelopment deployment records do not establish an automated, governed Production deployment\npipeline. Implementation and current approval-gate constraints are in Appendix B4.\n\n**Target / remaining gap.** The target sequence is CI validation, signed artifacts, DEV, UAT\nregression/security/performance and business acceptance, Production approval, deployment and\nverification. A release manifest must bind application/rules, agents, knowledge, prompts,\nmodel/embedding configuration, migrations, test/scan evidence and rollback references.\nEnvironment-dependent Oracle checks and Production migrations need evidence from the target\nenvironment; non-production also needs startup/readiness checks after deliberate cluster stops.\n\nManual decisions remain: SME approval for outcome-changing knowledge/rules, business acceptance,\nhigh-risk security review, release authorisation and emergency rollback. The Production approval\ngate must be enforceable in the chosen delivery platform before deployment credentials are enabled.\nThe customer may choose its own CI/CD tooling in the Telekom tenant; Azure DevOps and GitLab CI are\noptions to agree, not verified existing NCTSite tools. The current GitHub setup is not the customer's\nfinal deployment arrangement.","sha256":"8417622e4d331685af590c2e4d878903031e53fffa56d0f6ef10c781675843d7"},"textDiagram":"[n1] CI: build / tests [BUILT]\n  +-- παραδοτέα / στόχος --> [n2] Υπογραφή εικόνων [BLOCKED]\n  |   +-- διάθεση / στόχος --> [n3] DEV εγκατάσταση [DEV]\n  |   |   +-- επικύρωση / στόχος --> [n4] UAT αποδοχή [DESIGNED]\n  |   |   |   +-- αποδοχή / στόχος --> [n5] Έγκριση παραγωγής [PENDING]\n  |   |   |   |   +-- εξουσιοδότηση / στόχος --> [n6] Παραγωγική διάθεση [DESIGNED]"},{"question":13,"slug":"q13-trust-boundary","title":"Μη έμπιστη είσοδος και όρια εξουσίας","summary":"Ούτε χρήστης ούτε ανακτημένο περιεχόμενο μπορεί να εκχωρήσει δικαιώματα ή να παρακάμψει πολιτική εκτέλεσης.","nodes":[{"id":"n1","label":"Πολιτική εκτέλεσης","detail":"Ανώτερο όριο εξουσίας","status":"REQUIRED","type":"security","slot":0},{"id":"n2","label":"Εξουσιοδότηση","detail":"Ρόλοι / συμβάσεις πράκτορα","status":"REQUIRED","type":"security","slot":1},{"id":"n3","label":"Typed εργαλεία","detail":"Allowlist / SELECT / όρια","status":"BUILT","type":"backend","slot":2},{"id":"n4","label":"Περιορισμένη εκτέλεση","detail":"Επικύρωση ανεξάρτητα από LLM","status":"REQUIRED","type":"backend","slot":3},{"id":"n5","label":"Χρήστης και ανάκτηση","detail":"Μη έμπιστα δεδομένα","status":"UNTRUSTED","type":"external","slot":4},{"id":"n6","label":"Έλεγχοι ασφαλείας","detail":"Κακόβουλα έγγραφα / συμβάντα","status":"PARTIAL","type":"security","slot":5}],"edges":[{"from":"n1","to":"n2","label":"περιορίζει","target":false},{"from":"n2","to":"n3","label":"επιτρέπει","target":false},{"from":"n3","to":"n4","label":"επικυρώνει","target":false},{"from":"n5","to":"n4","label":"δεδομένα","target":false},{"from":"n6","to":"n5","label":"δοκιμάζει","target":true}],"notes":["Typed requests (αιτήματα καθορισμένων τύπων), allowlists (λίστες επιτρεπόμενων), δεσμευμένες τιμές και όρια πόρων υπάρχουν στη διαδρομή Oracle.","Δεν πρόκειται για SQL parser/AST filter (συντακτικό φίλτρο), ούτε για απόδειξη πλήρους ανοσίας σε prompt injection (έγχυση οδηγιών).","Η εγκεκριμένη γνώση επίσης δεν παραχωρεί δικαιώματα. Κακόβουλο περιεχόμενο μπορεί να επηρεάσει επιτρεπόμενα επιχειρήματα ή διατύπωση.","Σάρωση/καραντίνα, πλήρεις δοκιμές και δικαιώματα βάσης χρειάζονται ξεχωριστή τεκμηρίωση ανά περιβάλλον."],"geometry":{"edge3":{"labelAt":[1095,280]}},"source":{"title":"Protection against prompt injection and malicious retrieved content","body":"**Answer.** Neither user input nor retrieved content can override runtime/system policy,\nauthorisation, agent constraints or tool permissions. User input is also untrusted. Runtime policy\nsets the outer boundary; authorisation and agent/tool contracts constrain the user's request.\nRetrieved documents and tool results are untrusted data/evidence, not instructions that can change\nthat boundary. Even approved knowledge cannot grant tool permissions or override policy.\n\n**BUILT controls on the Oracle path:** typed tool requests, dataset/column/operator allowlists,\nserver-side construction of SELECT queries, bound values and row/time/response-size limits. The tool\ndoes not accept arbitrary SQL, so its protection is not an SQL parser/AST filter (Q16). Policy and\ntool validation must remain effective regardless of what the model proposes.\n\nThe Oracle adversarial tests verify this structured-query boundary, not complete prompt-injection\nresistance across the platform. Content scanning/quarantine at ingestion, malicious-document\nevaluations, end-to-end identity restrictions and security-event coverage must each have separate\nimplementation and deployment evidence; they are not all established by the Oracle test suite.\nThe production-readiness gate `oracle-read-only-controls: met` has that narrower scope.\nPrompt injection may still corrupt model output; deterministic evidence checks and human approval\nremain necessary, and no claim of immunity is made.\n\nPermitted tool arguments and model wording can still be influenced by malicious content. Negative\ntests must cover that narrower failure mode as well as attempts to invoke forbidden tools. Database\nwrite denial is a separate defence only after effective grants have been verified (Q16).","sha256":"f6db4884fe3eacae67039631bc40d5ac099ea76d2fbd449dd26292c99d4340aa"},"textDiagram":"[n1] Πολιτική εκτέλεσης [REQUIRED]\n  +-- περιορίζει --> [n2] Εξουσιοδότηση [REQUIRED]\n  |   +-- επιτρέπει --> [n3] Typed εργαλεία [BUILT]\n  |   |   +-- επικυρώνει --> [n4] Περιορισμένη εκτέλεση [REQUIRED]\n\n[n6] Έλεγχοι ασφαλείας [PARTIAL]\n  +-- δοκιμάζει / στόχος --> [n5] Χρήστης και ανάκτηση [UNTRUSTED]\n  |   +-- δεδομένα --> [n4] Περιορισμένη εκτέλεση [REQUIRED] (αναφορά)"},{"question":14,"slug":"q14-service-security","title":"Ασφάλεια μεταξύ υπηρεσιών","summary":"Η ασφάλεια παραγωγής αποδεικνύεται από εγκατεστημένη πολιτική και δοκιμές, όχι από πλήθος έτοιμων κοντέινερ.","nodes":[{"id":"n1","label":"Υπηρεσία Α","detail":"Ταυτότητα ανά φόρτο","status":"TARGET","type":"backend","slot":0},{"id":"n2","label":"Istio / STRICT mTLS","detail":"Αμοιβαία ταυτοποίηση και TLS","status":"TARGET","type":"security","slot":1},{"id":"n3","label":"Υπηρεσία Β","detail":"Ρητή επιτρεπόμενη επικοινωνία","status":"TARGET","type":"backend","slot":2},{"id":"n4","label":"Εξωτερικές εξαρτήσεις","detail":"TLS / private endpoints","status":"TARGET","type":"database","slot":3},{"id":"n5","label":"Πολιτικές και bindings","detail":"PeerAuthentication / ταυτότητες","status":"VERIFY","type":"security","slot":4},{"id":"n6","label":"Θετικές / αρνητικές δοκιμές","detail":"Επιτρεπτή σύνδεση / άρνηση","status":"VERIFY","type":"security","slot":5}],"edges":[{"from":"n1","to":"n2","label":"ταυτότητα","target":true},{"from":"n2","to":"n3","label":"πολιτική","target":true},{"from":"n3","to":"n4","label":"TLS","target":true},{"from":"n5","to":"n2","label":"επιβολή","target":true},{"from":"n6","to":"n5","label":"επαλήθευση","target":true}],"notes":["TARGET (στόχος): συνεχής παραγωγική τοπολογία. Υπάρχει βάση AKS/Istio, όχι απόδειξη καθολικής επιβολής.","Τεκμήρια: istio-proxy, PeerAuthentication STRICT, AuthorizationPolicy, NetworkPolicies και bindings (δεσμεύσεις ταυτότητας).","Ελέγχονται ιδιωτική συνδεσιμότητα, εξερχόμενη κίνηση και ανανέωση πιστοποιητικών/tokens (διακριτικών).","SPIFFE/SPIRE attestation (επαλήθευση ταυτότητας φόρτου) και Entra Workload Identity (ταυτότητα φόρτου) είναι χωριστοί μηχανισμοί."],"geometry":{"edge3":{"labelAt":[1095,280]}},"source":{"title":"Service-to-service authentication and encryption in Production","body":"**Answer.** The Production baseline requires private networking, per-service identity, explicit\nservice-to-service authorisation, STRICT mutual TLS within the mesh, network restrictions and TLS\nto external dependencies. Workload/managed identity is preferred to shared or stored credentials.\n\n**Current state.** The repository records the AKS service decomposition and an Istio implementation\nfoundation. This does not establish enforcement throughout a continuously available Production\ntopology. Container counts or readiness alone are not evidence of a mesh security control.\n\n**Target / remaining gap.** Evidence must identify the deployed `istio-proxy` containers in the\nsidecar-based topology, effective `PeerAuthentication` in `STRICT` mode, explicit\n`AuthorizationPolicy` allow rules, NetworkPolicies, Workload Identity bindings, private endpoints,\nrestricted egress and certificate/token rotation. Positive and negative connectivity tests must\nprove permitted traffic works and unauthorised service connections are refused, including relevant\nexternal dependencies such as PostgreSQL, Oracle, Redis and model/API endpoints.\n\nSPIFFE/SPIRE attestation and Entra Workload Identity bindings are separate mechanisms. Neither a\nsidecar nor an Azure identity binding alone proves attestation, STRICT mTLS or coverage of all\noutbound traffic. Each claim needs deployed configuration and test evidence for its environment.","sha256":"9413230b9ec8c230f0563b4870e202bea2f77a4e8577f368d206b3c42873b8e7"},"textDiagram":"[n1] Υπηρεσία Α [TARGET]\n  +-- ταυτότητα / στόχος --> [n2] Istio / STRICT mTLS [TARGET]\n  |   +-- πολιτική / στόχος --> [n3] Υπηρεσία Β [TARGET]\n  |   |   +-- TLS / στόχος --> [n4] Εξωτερικές εξαρτήσεις [TARGET]\n\n[n6] Θετικές / αρνητικές δοκιμές [VERIFY]\n  +-- επαλήθευση / στόχος --> [n5] Πολιτικές και bindings [VERIFY]\n  |   +-- επιβολή / στόχος --> [n2] Istio / STRICT mTLS [TARGET] (αναφορά)"},{"question":15,"slug":"q15-data-boundaries","title":"Περιεχόμενο, διατήρηση και γεωγραφία","summary":"Η αποθήκευση NCT-AI, η διατήρηση παρόχου και η γεωγραφία επεξεργασίας είναι διαφορετικά όρια.","nodes":[{"id":"n1","label":"Περιεχόμενο ανά ρόλο","detail":"Chat / embeddings / Verify","status":"MIXED","type":"frontend","slot":0},{"id":"n2","label":"Ελαχιστοποίηση","detail":"Επιλεγμένα πεδία και τεκμήρια","status":"REQUIRED","type":"security","slot":1},{"id":"n3","label":"Πάροχος μοντέλου","detail":"Chat EU / embeddings Global","status":"CONFIG","type":"cloud","slot":2},{"id":"n4","label":"Διατήρηση παρόχου","detail":"Χωριστή έγκριση εξαίρεσης","status":"VERIFY","type":"security","slot":3},{"id":"n5","label":"Αποθήκευση NCT-AI","detail":"CaptureContent ανά περιβάλλον","status":"CONFIG","type":"database","slot":4},{"id":"n6","label":"Διαγραφή και πολιτική","detail":"Αρχεία / προβολές / αντίγραφα","status":"DESIGNED","type":"security","slot":5}],"edges":[{"from":"n1","to":"n2","label":"επιλογή","target":false},{"from":"n2","to":"n3","label":"επεξεργασία","target":false},{"from":"n3","to":"n4","label":"χωριστό όριο","target":false},{"from":"n2","to":"n5","label":"καταγραφή","target":false},{"from":"n5","to":"n6","label":"διατήρηση","target":true}],"notes":["CONFIG (ρύθμιση αποθετηρίου), όχι ζωντανός έλεγχος: chat DataZoneStandard, embeddings GlobalStandard. Το Global δεν εγγυάται επεξεργασία μόνο εντός ΕΕ.","Η εξήγηση AGG-01 στέλνει αποτέλεσμα/λόγο/id, όχι όλη την Oracle ή το OKF. Το Verify λαμβάνει επιλεγμένα προηγούμενα παραδοτέα.","CaptureContent=None είναι προεπιλογή βιβλιοθήκης, ενώ dev/local χρησιμοποιεί BoundedMetadata. Τοπική καταγραφή δεν ελέγχει διατήρηση παρόχου.","Οι περίοδοι διατήρησης και το πενταετές audit (καταγραφή ελέγχου) είναι προτάσεις προς συμφωνία, όχι ενεργές εγγυήσεις ή επαληθευμένη νομική υποχρέωση."],"geometry":{"edge3":{"labelAt":[1095,280]},"edge4":{"labelAt":[640,280]}},"source":{"title":"Data processed by NCT-AI, what reaches Azure OpenAI, and minimisation/retention/deletion policy","body":"**Answer.** NCT-AI processes user requests, identity/session metadata, selected engineering facts,\napproved knowledge and retrieval projections, workflow state, model requests/responses, and audit\nreferences. Oracle remains authoritative for the operational facts. The intended model payload is a\nuser question plus selected knowledge snippets, curated facts and rule outcomes, not complete Oracle\ntables, credentials or unrelated user/history data. Field allowlists, typed tools and context budgets\nsupport minimisation; classification and masking coverage must be validated per use case before\nProduction.\n\nPayloads differ by path: model-backed chat can send the user prompt, selected history and retrieved\ncontext; embedding projection sends selected knowledge chunks when that projection is generated or\nrebuilt, not necessarily only once. The PoTP explanation path sends decision/reason information and an\nelement identifier, not the full Oracle facts or full OKF bundle. Its deterministic decision needs no\nmodel call. The new response's free-text routing and approval-reply classification examples must not be\ntreated as universal implemented model calls; the current intent router is rule-based (Q10).\n\nThe plan verifier receives selected prior-step artifacts, so those artifacts need their own\nclassification and minimisation review. Its lack of tools does not mean no content is sent to the\nmodel. Conversely, the AGG-01 explanation payload does not justify sending a complete OKF corpus.\n\nThree separate boundaries govern retention and processing:\n\n| Boundary | Current position and requirement |\n|---|---|\n| NCT-AI storage | The ledger library defaults to `CaptureContent=None`, but `dev/local/start.sh` explicitly defaults to `BoundedMetadata`. Effective configuration must be checked per environment. Outside Development, enabling that capture requires a bounded content-retention setting; this startup validation does not prove deletion across all stores. |\n| Provider retention | Microsoft may retain selected prompts/completions for abuse-monitoring human review. Modified monitoring requires separate approval; none is assumed here. Local capture settings do not control it. |\n| Processing geography | Repository Bicep defaults specify chat `gpt-5.4-mini` as `DataZoneStandard` and embeddings `text-embedding-3-small` as `GlobalStandard`. This is configuration evidence, not a fresh inspection of live deployments. |\n\nMicrosoft states that customer content is not used to train foundation models without permission.\nEU DataZone processing stays within the EU; Global processing can occur elsewhere. Storage geography\nis distinct, and a private endpoint does not determine inference location.\n[Microsoft data privacy and processing geography](https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/openai/data-privacy).\n\nFor an EU-only processing requirement, the embeddings deployment must be changed to a supported\ncompliant option or receive explicit approval for the exception. Verify each live deployment's SKU,\nmodel/version, retention features and abuse-monitoring status before approval.\n\nProposed **NCT-AI** retention periods, subject to Telekom approval: conversations 30 days UAT /\n90 days Production; diagnostic prompt/completion copies 7–30 days UAT / 30 days or disabled in\nProduction; feedback 12–24 months, de-identified where possible; embeddings until source retirement;\naudit/security metadata 90–180 days UAT / 12–24+ months Production. These are policy proposals, not\nimplemented retention guarantees or provider retention periods. Deletion procedures must cover\nconversations, derived projections, workflow history and backups according to the approved policy,\nwith verification of expiry and deletion. Q25 and Q29 distinguish usage measurements from cost estimates.\n\nThe additional response proposes 30-day prompts, 90-day active conversations followed by archive,\ntwo-year invocation metadata and at least five-year audit retention. These are alternative policy\ninputs, not approved replacements for the ranges above. Compliance must resolve them into one schedule\nper data category, including archive expiry, legal holds and backups. The attribution of five years to\nNIS2 Article 21 is not accepted as verified legal justification; the applicable legal basis and duration\nmust be confirmed. Nor is a provider \"no data logging\" opt-out assumed enabled without approval evidence.","sha256":"1a277ab779edd226a254a245f1b4504e136180b95747f1d5a4ea17d8b890a9d4"},"textDiagram":"[n1] Περιεχόμενο ανά ρόλο [MIXED]\n  +-- επιλογή --> [n2] Ελαχιστοποίηση [REQUIRED]\n  |   +-- επεξεργασία --> [n3] Πάροχος μοντέλου [CONFIG]\n  |   |   +-- χωριστό όριο --> [n4] Διατήρηση παρόχου [VERIFY]\n  |   +-- καταγραφή --> [n5] Αποθήκευση NCT-AI [CONFIG]\n  |   |   +-- διατήρηση / στόχος --> [n6] Διαγραφή και πολιτική [DESIGNED]"},{"question":16,"slug":"q16-read-and-dryrun","title":"Ανάγνωση Oracle και όριο εγγραφών","summary":"Η ανάγνωση Oracle είναι χωριστή από τον πελάτη Work Order. Η ολοκληρωμένη διαδρομή εκτελείται μόνο ως DryRun, χωρίς πραγματική εγγραφή.","nodes":[{"id":"n1","label":"Typed QueryRequest","detail":"Καθορισμένο αίτημα ανάγνωσης","status":"BUILT","type":"backend","slot":0},{"id":"n2","label":"SELECT και παράμετροι","detail":"Λίστες επιτρεπόμενων / όρια","status":"BUILT","type":"security","slot":1},{"id":"n3","label":"Oracle ανάγνωση","detail":"Grants προς επαλήθευση DBA","status":"DEV","type":"database","slot":2},{"id":"n4","label":"Πραγματική εγγραφή","detail":"Δεν έχει εκτελεστεί","status":"NOT APPROVED","type":"external","slot":3},{"id":"n5","label":"Work Order DryRun","detail":"Προεπισκόπηση χωρίς εγγραφή","status":"COMPLETE DRYRUN","type":"backend","slot":4},{"id":"n6","label":"Μηχανικός / πολιτική","detail":"Χωριστός πελάτης HTTP","status":"PARTIAL","type":"security","slot":5}],"edges":[{"from":"n1","to":"n2","label":"επικύρωση","target":false},{"from":"n2","to":"n3","label":"SELECT","target":false},{"from":"n6","to":"n5","label":"έγκριση","target":false},{"from":"n5","to":"n4","label":"δεν γράφει","target":true}],"notes":["Η ένδειξη COMPLETE DRYRUN αφορά την τεκμηριωμένη διαδρομή της 2026-09-11, όχι πραγματικό NCTSite write (εγγραφή).","PARTIALLY BUILT (μερικώς υλοποιημένη) πραγματική εγγραφή: πελάτης, σύμβαση, ταυτοδυναμία και δοκιμές υπάρχουν. Σήμερα απαγορεύεται η δημιουργία NCTAI_WO_WRITE.","Η απόφαση μόνο DryRun δεν επιβάλλεται ακόμη ως υποχρεωτικός κανόνας κώδικα/εγκατάστασης. Αυτό παραμένει ρητή εκκρεμότητα.","Μελλοντική εγγραφή θέλει νέα απόφαση υπευθύνου, δικαιώματα, έγκριση μηχανικού, audit και πλήρη αποδοχή. Η επιστροφή Submitted/id δεν αποδεικνύει εγγραφή."],"geometry":{},"source":{"title":"Technical enforcement that the Oracle read path is read-only, and separation from the Work Order write path","body":"**Answer.** Oracle reads and Work Order commands are separate paths. The read tool accepts typed,\nallowlisted requests, constructs SELECT queries server-side, binds values and enforces resource\nlimits. The Work Order client does not reuse that connection or accept arbitrary SQL.\n\n**Current state, reads: BUILT and tested at the application boundary.** No SQL parser/AST validator\nor explicit `READ ONLY` transaction is claimed. The intended database account has session access\nand SELECT on approved business objects, without business-object write privileges. Effective grants,\ninherited roles and other privileges require separate DBA verification in each target database.\nA documented development read is not a Production grant audit (Appendix B5).\n\n**Current state, actual writes: PARTIALLY BUILT.** The client, HTTP contract, approval/policy checks,\nidempotency handling and tests exist. The plan of record marks the governed end-to-end path complete\n**for DryRun only**: preview execution, not persistence of a Work Order in NCTSite. The platform has\nnot executed a real NCTSite write. The current operating decision permits DryRun only and prohibits\nprovisioning the proposed write account; this is not an operational write capability.\n\n**Target / remaining gap.** The DryRun-only operating decision still needs a matching enforceable\ncode/deployment invariant; the plan explicitly records that gap. Actual write execution is neither\napproved nor deployed. Any future change requires a new explicit owner decision, verified API\nauthorisation, identities and grants, engineer approval, idempotency/audit controls and live\nend-to-end acceptance. It is not authorised simply by completing DryRun or changing a configuration\nflag. Appendix B5 distinguishes the completed DryRun evidence from older pending-status entries.","sha256":"f4a7a1c73de6177c79dad155c9db90a969f85829187a8df6d716ac77abc19024"},"textDiagram":"[n1] Typed QueryRequest [BUILT]\n  +-- επικύρωση --> [n2] SELECT και παράμετροι [BUILT]\n  |   +-- SELECT --> [n3] Oracle ανάγνωση [DEV]\n\n[n6] Μηχανικός / πολιτική [PARTIAL]\n  +-- έγκριση --> [n5] Work Order DryRun [COMPLETE DRYRUN]\n  |   +-- δεν γράφει / στόχος --> [n4] Πραγματική εγγραφή [NOT APPROVED]"},{"question":17,"slug":"q17-audit-and-replay","title":"Καταγραφή ελέγχου και αναπαραγωγή","summary":"Το audit trail (ίχνος ελέγχου) συνδέει τεκμήρια· δεν ανακατασκευάζει διαγραμμένα δεδομένα ούτε εγγυάται ίδια έξοδο LLM.","nodes":[{"id":"n1","label":"Εκτέλεση και ταυτότητα","detail":"Χρήστης / run / trace","status":"PARTIAL","type":"frontend","slot":0},{"id":"n2","label":"Καταγραφή και συσχέτιση","detail":"Chat persistence / Trace view","status":"BUILT","type":"database","slot":1},{"id":"n3","label":"Διερεύνηση αιτίας","detail":"Εκδόσεις και αποτελέσματα","status":"REQUIRED","type":"backend","slot":2},{"id":"n4","label":"Αναπαραγωγή C#","detail":"Ίδια δεδομένα / γνώση / κώδικας","status":"CONDITIONAL","type":"backend","slot":3},{"id":"n5","label":"Αμετάβλητα στιγμιότυπα","detail":"Αρχική είσοδος και εκδόσεις","status":"REQUIRED","type":"database","slot":4},{"id":"n6","label":"Πολιτική διατήρησης","detail":"Περιεχόμενο μόνο όπου επιτρέπεται","status":"REQUIRED","type":"security","slot":5}],"edges":[{"from":"n1","to":"n2","label":"καταγραφή","target":false},{"from":"n2","to":"n3","label":"διερεύνηση","target":false},{"from":"n3","to":"n4","label":"αναπαραγωγή","target":true},{"from":"n5","to":"n4","label":"ίδιες είσοδοι","target":false},{"from":"n6","to":"n5","label":"επιτρέπει","target":false}],"notes":["Υπάρχει μόνιμη καταγραφή συνομιλίας/κλήσεων· δεν τεκμηριώνεται πλήρης κάλυψη κάθε υπηρεσίας και χρήστη.","Hashes (αποτυπώματα) και IDs (αναγνωριστικά) δίνουν ακεραιότητα/συσχέτιση, όχι διαγραμμένο περιεχόμενο.","Temporal replay (αναπαραγωγή ιστορικού) δεν εγγυάται ίδια νέα ανάγνωση Oracle ή ίδια νέα inference (εκτέλεση μοντέλου).","Διακρίνονται απόφαση C#, έγκριση γνώσης, διατύπωση LLM, ετυμηγορία Verify και ανθρώπινη έγκριση. Έλλειψη τεκμηρίων δηλώνεται."],"geometry":{"edge3":{"labelAt":[1095,280]}},"source":{"title":"End-to-end audit trail and root-cause debugging of wrong recommendations","body":"**Answer.** **Mandatory Production/UAT requirement, not yet complete at every hop.** The target audit\nrecord links user/role/session, execution and trace IDs, intent/agent/policy versions, fact and tool\nreferences, pinned knowledge version, executable rule version/results, prompt/model versions, usage,\nevidence, final recommendation and feedback. A durable queryable trail exists in `NCT.AI.Chat`\nand the AG-UI Trace view exposes correlation; full cross-service coverage and user attribution still\nneed verification (Q25).\n\nAuditability is not identical to exact replay. Identifiers and hashes establish correlation and\nintegrity but cannot reconstruct deleted facts or model content. Reading Oracle again can return\ndifferent facts. Deterministic reproduction requires retained input snapshots or immutable fact\nartifacts, the originally pinned knowledge, and compatible rule/application versions. Model inputs and\noutputs can only be inspected where capture and retention policy permit; calling the same model again\ndoes not guarantee the same answer. Temporal history replays recorded workflow decisions, not a\nguarantee that a newly executed external read or inference reproduces the original result.\n\nInvestigation therefore first establishes which evidence remains available, inspects the recorded\nversions and outcomes, distinguishes original facts from fresh observations, classifies the cause and\nadds a regression case. Missing or expired evidence must be reported as a reproducibility limitation,\nnot reconstructed from hashes or silently replaced with current data.\n\nThe additional response's statement that no environment has any durable audit storage is too broad:\nchat persistence and model invocation records must be distinguished from incomplete platform-wide\naudit coverage. A metadata-only ledger also cannot show the original model answer without an approved,\nretained content artifact.\n\nRecord the distinction between rule decision, knowledge approval, model-authored explanation,\nverifier verdict and engineer approval. An approved knowledge pin establishes which source version was\nused, not that the C# rule faithfully implements its meaning; that needs the consistency checks in Q6.","sha256":"211f8414e0d8c1f72c239a299b3d3b67ccc31ce7c1a04d4e8d46f2b16723854e"},"textDiagram":"[n1] Εκτέλεση και ταυτότητα [PARTIAL]\n  +-- καταγραφή --> [n2] Καταγραφή και συσχέτιση [BUILT]\n  |   +-- διερεύνηση --> [n3] Διερεύνηση αιτίας [REQUIRED]\n  |   |   +-- αναπαραγωγή / στόχος --> [n4] Αναπαραγωγή C# [CONDITIONAL]\n\n[n6] Πολιτική διατήρησης [REQUIRED]\n  +-- επιτρέπει --> [n5] Αμετάβλητα στιγμιότυπα [REQUIRED]\n  |   +-- ίδιες είσοδοι --> [n4] Αναπαραγωγή C# [CONDITIONAL] (αναφορά)"},{"question":18,"slug":"q18-ha-dr","title":"Διαθεσιμότητα και ανάκαμψη","summary":"Το λειτουργικό AKS ανάπτυξης δεν αποδεικνύει συνεχή παραγωγική διαθεσιμότητα ή ανάκαμψη περιοχής.","nodes":[{"id":"n1","label":"Ανάπτυξη / UAT","detail":"AKS με σκόπιμο stop/start","status":"DEV","type":"cloud","slot":0},{"id":"n2","label":"Συνεχής παραγωγή","detail":"Πολλαπλά replicas / ζώνες","status":"DESIGNED","type":"cloud","slot":1},{"id":"n3","label":"Βάσεις και workflows","detail":"HA PostgreSQL / Temporal","status":"DESIGNED","type":"database","slot":2},{"id":"n4","label":"Δευτερεύουσα περιοχή","detail":"Ανάκαμψη δεδομένων και ρυθμίσεων","status":"DESIGNED","type":"cloud","slot":3},{"id":"n5","label":"Δοκιμή ανάκαμψης","detail":"Συνολική εφαρμογή και εξαρτήσεις","status":"REQUIRED","type":"security","slot":4},{"id":"n6","label":"RTO / RPO","detail":"Εγκεκριμένοι στόχοι πελάτη","status":"PENDING","type":"external","slot":5}],"edges":[{"from":"n1","to":"n2","label":"άλλη λειτουργία","target":true},{"from":"n2","to":"n3","label":"ανθεκτικότητα","target":true},{"from":"n3","to":"n4","label":"σχέδιο DR","target":true},{"from":"n4","to":"n5","label":"δοκιμή","target":true},{"from":"n6","to":"n5","label":"κριτήρια","target":true}],"notes":["HA (υψηλή διαθεσιμότητα) και DR (ανάκαμψη καταστροφής) απαιτούν διαφορετικά τεκμήρια.","Η αναφορά PostgreSQL σε RPO 0 και συνήθη μετάπτωση 60-120s αφορά τη βάση, όχι εγγυημένο RTO (χρόνο ανάκαμψης) εφαρμογής.","Backup/restore 24h/48h, warm standby 1h/4h και active/active 0/\u003c15min είναι μη δοκιμασμένοι στόχοι RPO/RTO (απώλειας δεδομένων/ανάκαμψης).","Ολοκληρωμένη δοκιμή καλύπτει γνώση, Temporal, ταυτότητες, δίκτυο και πάροχο μοντέλου. Redis δεν κρατά αναντικατάστατα επίσημα δεδομένα."],"geometry":{"edge3":{"labelAt":[1095,280]}},"source":{"title":"High Availability and Disaster Recovery","body":"**Answer.** Production HA and DR are designed separately from the current development/UAT operating\nmode: the cluster already exists and NCT-AI workloads have been deployed and observed running, and being\nstopped when idle in the current cost-optimised non-production mode is a cost-management decision, not a\nfailure of HA design — Production needs a different operating posture of continuously running capacity,\nmulti-replica wor
