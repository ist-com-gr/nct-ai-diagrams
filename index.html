kloads, zonal resilience where supported, monitored failover and tested DR. AKS:\nproduction Standard/Premium tier, multiple availability zones where the region supports them, at least\n3 nodes, multiple pod replicas, topology spread/anti-affinity, PodDisruptionBudgets, HPA,\nreadiness/liveness/startup probes, rolling deployment, zone-aware storage — the next step is not\n\"deploy to AKS\" (already demonstrated in namespace `nct-ai`) but proving replica distribution, zone\nbehaviour, failover and recovery under the final Production topology. PostgreSQL/pgvector/AGE: Azure\nDatabase for PostgreSQL Flexible Server with zone-redundant HA, PITR/backups, and geo-redundant backup\nor cross-region read replica per DR requirements. Microsoft's HA figures concern the database:\nRPO 0 for committed transactions and typical failover of 60–120 seconds, which can take longer under\nload. They are not a hard 120-second bound or the application's end-to-end RTO; reconnects, workers,\nqueues and dependent services need separate recovery tests, as does regional DR.\n[PostgreSQL HA documentation](https://learn.microsoft.com/en-us/azure/postgresql/high-availability/concepts-high-availability).\nTemporal: self-hosted with multiple\nFrontend/History/Matching replicas and HA PostgreSQL persistence, or Temporal Cloud as the managed\nalternative. Redis: Azure Managed Redis, holding no authoritative data that cannot be reconstructed.\nModel provider: primary plus controlled fallback deployment with timeout/circuit-breaker for Azure, or\nN+1 replicated capacity with a load balancer for a local option. DR: a primary-region topology (AKS,\nPostgreSQL HA, Managed Redis, storage, model endpoint) replicating configuration/data to a secondary\nregion on warm standby; an initial discussion target of near-zero RPO for critical\nconfiguration/knowledge artifacts (already replicated/source-controlled), a customer-selected RPO for\noperational PostgreSQL, and an RTO target in hours rather than days for platform recovery. Final RTO/RPO\nrequire Telekom Business Continuity approval.\n\nThe new response supplies three options for discussion: backup/restore at RPO 24h and RTO 48h;\nwarm standby at RPO 1h and RTO 4h; and active/active aiming at RPO 0 and RTO under 15 minutes.\nThese are untested business targets, not properties obtained merely by choosing those topologies.\nIn particular, RPO 0 across regions requires a demonstrated replication/consistency design for every\nauthoritative store; zonal database HA does not establish it. Select a tier and test the complete\nrecovery path, including knowledge, Temporal state, identities, networking and model availability.","sha256":"4b46aef2159026eafe5ee77d2b1f10902bda1b83955c4e2cd7c4637dd5394ecd"},"textDiagram":"[n1] Ανάπτυξη / UAT [DEV]\n  +-- άλλη λειτουργία / στόχος --> [n2] Συνεχής παραγωγή [DESIGNED]\n  |   +-- ανθεκτικότητα / στόχος --> [n3] Βάσεις και workflows [DESIGNED]\n  |   |   +-- σχέδιο DR / στόχος --> [n4] Δευτερεύουσα περιοχή [DESIGNED]\n  |   |   |   +-- δοκιμή / στόχος --> [n5] Δοκιμή ανάκαμψης [REQUIRED]\n\n[n6] RTO / RPO [PENDING]\n  +-- κριτήρια / στόχος --> [n5] Δοκιμή ανάκαμψης [REQUIRED] (αναφορά)"},{"question":19,"slug":"q19-nctsite-interfaces","title":"Δύο διαδρομές ανάγνωσης NCTSite","summary":"Το AGG-01 διαβάζει μέσω Oracle MCP ή PoTP REST. Η γνώση OKF δεν είναι τρίτη ζωντανή ανάγνωση NCTSite.","nodes":[{"id":"n1","label":"Oracle MCP / NCTSite","detail":"Επιμελημένες όψεις","status":"PARTIAL","type":"backend","slot":0},{"id":"n2","label":"AGG-01","detail":"Συμβουλευτικός πιλοτικός","status":"CURRENT","type":"frontend","slot":1},{"id":"n3","label":"PoTP REST / NCTSite","detail":"Έξι συμβάσεις GET","status":"PARTIAL","type":"backend","slot":2},{"id":"n4","label":"Work Order POST","detail":"Χωριστός πελάτης / μόνο DryRun","status":"PARTIAL","type":"backend","slot":3},{"id":"n5","label":"Γνώση OKF","detail":"Δεν είναι ζωντανή ανάγνωση","status":"BUILT","type":"database","slot":4},{"id":"n6","label":"Αποδοχή συμβάσεων","detail":"Εξουσιοδότηση και περιβάλλον","status":"REQUIRED","type":"security","slot":5}],"edges":[{"from":"n1","to":"n2","label":"δεδομένα","target":false},{"from":"n3","to":"n2","label":"δεδομένα","target":false},{"from":"n5","to":"n2","label":"τεκμήρια","target":false},{"from":"n6","to":"n1","label":"επικύρωση","target":true}],"notes":["GET: creation-eligibility, shelf-context, installed-equipment, interfaces, slots και next-code κάτω από api/v1/potp-mux.","Η ύπαρξη πελάτη/δοκιμών δεν αποδεικνύει λειτουργία κάθε endpoint (σημείου πρόσβασης) στην παραγωγή.","Το POST work-orders είναι χωριστό από τη σύνδεση ανάγνωσης Oracle, με έγκριση/πολιτική και χωρίς ενεργοποιημένη εγγραφή.","Οι προτάσεις Φάσης 2 ή 10-15 όψεων ανά σενάριο δεν είναι εγκεκριμένο αντικείμενο ή επαληθευμένη απογραφή."],"geometry":{},"source":{"title":"New NCTSite APIs/views/interfaces required for integration","body":"**Answer.** AGG-01 already has two operational read integration paths in code: curated Oracle views\nthrough the Oracle MCP server, and typed NCTSite REST reads through the PoTP MCP/API path. Knowledge\nretrieval provides supporting approved content; it is not a third live read of NCTSite.\n\nThe existing PoTP REST client contracts use base path `api/v1/potp-mux`:\n\n| Method | Relative path | Purpose |\n|---|---|---|\n| GET | `components/{id}/creation-eligibility` | Creation eligibility |\n| GET | `components/{id}/shelf-context` | Shelf context |\n| GET | `components/{id}/installed-equipment` | Installed equipment |\n| GET | `cards/{id}/interfaces` | Card interfaces |\n| GET | `chassis/{id}/slots` | Chassis slots |\n| GET | `next-code` | Next-code lookup |\n| POST | `work-orders` | Separate approval/policy-gated Work Order command; currently DryRun only (Q16) |\n\n**Partially BUILT:** these client contracts and the curated Oracle integration. The existence of a\nclient or mocked contract test does not prove every endpoint is authorised and operational in\nProduction. The Work Order command is not part of the read-only Oracle connection.\n\nAdditional per-use-case curated views, entity-context/deep-link integration, user/role/scope mapping,\noptional change events and contract-version negotiation require agreement with the NCTSite owner.\nThese broader integrations remain **DESIGNED** unless separately evidenced. Keep the stable\nview/API contract independent of NCTSite's internal table layout.\n\n**Proposed delivery scope:** Phase 1 is an advisory-only AGG-01 pilot. The source's Phase 2 write\nproposal is not approved scope or permission to execute writes. The current decision remains\nDryRun-only (Q16); changing it requires a separate owner decision and acceptance, regardless of phase.\nEnforce this restriction through code/deployment policy and permissions, not just UI.\nThe new response also requests approval before sensitive reads and auditable readback: agree the\ndataset classification, approver and enforcement point; do not infer these controls from a view alone.\nIts estimates of 10–15 views per scenario and approximately 200 overall are not a verified inventory.\nCount reusable data contracts first. The proposed `NCTAI_WO_WRITE` account must not be provisioned\nunder the current DryRun-only decision; its name is not evidence of an API identity or effective grants.","sha256":"0e0da7ea06cd55f9bcdc5dfdf7cc7fd4f6ee473212780ecdbe71455931d86fdf"},"textDiagram":"[n3] PoTP REST / NCTSite [PARTIAL]\n  +-- δεδομένα --> [n2] AGG-01 [CURRENT]\n\n[n4] Work Order POST [PARTIAL]\n\n[n5] Γνώση OKF [BUILT]\n  +-- τεκμήρια --> [n2] AGG-01 [CURRENT] (αναφορά)\n\n[n6] Αποδοχή συμβάσεων [REQUIRED]\n  +-- επικύρωση / στόχος --> [n1] Oracle MCP / NCTSite [PARTIAL]\n  |   +-- δεδομένα --> [n2] AGG-01 [CURRENT] (αναφορά)"},{"question":20,"slug":"q20-external-systems","title":"Εξωτερικά συστήματα ανά σενάριο","summary":"Υπάρχουσα επιχειρησιακή εξάρτηση δεν ισοδυναμεί με νέο ή ήδη εγκατεστημένο connector (σύνδεσμο ενσωμάτωσης).","nodes":[{"id":"n1","label":"SAP νυχτερινή ροή","detail":"Υφιστάμενα υλικά / αποθήκη","status":"CURRENT","type":"external","slot":0},{"id":"n2","label":"NCTSite","detail":"Δεδομένα και προέλευση","status":"CURRENT","type":"database","slot":1},{"id":"n3","label":"NCT-AI σενάρια","detail":"Συμβάσεις και πολιτικές","status":"MIXED","type":"backend","slot":2},{"id":"n4","label":"Μήτρα διεπαφών","detail":"Ρόλος / φάση / έγκριση / owner","status":"REQUIRED","type":"security","slot":3},{"id":"n5","label":"Atoll / mcSON","detail":"Γνωστές απαιτήσεις σεναρίων","status":"REQUIREMENT","type":"external","slot":4},{"id":"n6","label":"eSurvey / Cronoss / OSS","detail":"Προτεινόμενες συνδέσεις","status":"PROPOSAL","type":"external","slot":5}],"edges":[{"from":"n1","to":"n2","label":"τροφοδοσία","target":false},{"from":"n2","to":"n3","label":"ανάγνωση","target":false},{"from":"n3","to":"n4","label":"απογραφή","target":true},{"from":"n5","to":"n4","label":"συμφωνία","target":true}],"notes":["SAP: RAN-02/AGG-04 και διαθεσιμότητα AGG-01 μέσω NCTSite όπου επαρκεί· όχι τεκμήριο άμεσου συνδέσμου SAP.","Atoll: RAN-03/RAN-05. mcSON: RAN-05/RAN-06. Απαιτείται επιβεβαίωση κατεύθυνσης, συμβάσεων και πραγματικής υλοποίησης.","eSurvey: RAN-03/RAN-05· Cronoss: RAN-05· OSS/NMS: AGG-06/MW-04. Ariadne προτείνεται εκτός τρέχουσας φάσης, υπό αποδοχή.","Η Use Case × Interface matrix (μήτρα σεναρίων/διεπαφών) διακρίνει υπάρχουσα ροή, νέα πρόταση, read/write (ανάγνωση/εγγραφή), ιδιοκτήτη και κατάσταση."],"geometry":{"edge3":{"labelAt":[1095,280]}},"source":{"title":"External systems/interfaces required per use case and phase (Atoll, mcSON, SAP, Ariadne)","body":"**Answer.** Requirements are partly known from the scenarios; implementation status and interface\napproval are separate questions. Absence of a direct NCT-AI connector does not make an existing\nbusiness-system dependency unknown.\n\n| Scenario / system | Specified requirement or existing flow | NCT-AI implementation / outstanding decision |\n|---|---|---|\n| RAN-03 / Atoll | Planning outputs are a source; the scenario describes an existing, partly manual exchange with NCTSite | Direct automated integration is not evidenced; agree supported API/export, direction, cadence and owner with the SME |\n| RAN-05 / mcSON | Licensing-table workflow includes NCTSite–mcSON exchange | Confirm the existing interface and whether NCT-AI needs direct access or consumes NCTSite data |\n| RAN-02 and AGG-04 / SAP | Existing nightly SAP-to-NCTSite warehouse/material feed | Prefer the existing governed NCTSite data where adequate; a new direct SAP integration is not automatically required. Validate freshness and fields |\n| AGG-01 / SAP-derived availability | Deterministic rules use availability facts | This does not establish a direct SAP connector; verify provenance and freshness through the supplied NCTSite facts |\n| Ariadne | The additional response proposes exclusion from the current phase | Record as proposed out of scope, subject to customer acceptance; no confirmed connector requirement |\n| RAN-05/RAN-06 / mcSON; RAN-03/RAN-05 / Atoll | The additional response proposes Phase 2 read/write and new-site exchanges | Confirm each scenario mapping, direction and existing/new contract; do not infer ready REST endpoints from this proposal |\n| RAN-03/RAN-05 / eSurvey | The additional response lists site creation and licensing-table drafting | Proposed/in discussion; confirm owner, supported contract and delivery phase |\n| RAN-05 / Cronoss | The additional response proposes an event-triggered Work Order/licensing-table push | Proposed Phase 2 dependency, not a deployed NCT-AI integration |\n| AGG-06/MW-04 / OSS/NMS | The additional response proposes scheduled snapshots | Proposed Phase 2; agree exporter, freshness and ownership, without assuming live network control |\n\nSources: `submodules/NCT-AI/docs/specs/ran-03-new-site-requirements.md`,\n`ran-05-licensing-table-requirements.md`, `ran-02-material-planning-requirements.md` and\n`agg-04-warehouse-requirements.md` in the same directory. Scenario requirements are not evidence of\ncompleted SME approval or a deployed integration.\n\nThe formal Use Case × Interface matrix should record the requirement, existing flow, proposed new\ninterface, read/write scope, owner, approval, implementation and deployment status, and delivery phase.\nFor any new connection, use the system's supported API/export/integration layer, register the tool,\nand apply policy, timeout/retry, schema/version and audit controls. Do not introduce direct database\ndependencies or an extra connector merely because a system appears in a scenario.","sha256":"052a8a71cdccf62f052cc5f3de665fd23e1636ad6c7a73e05729e40403aecf85"},"textDiagram":"[n1] SAP νυχτερινή ροή [CURRENT]\n  +-- τροφοδοσία --> [n2] NCTSite [CURRENT]\n  |   +-- ανάγνωση --> [n3] NCT-AI σενάρια [MIXED]\n  |   |   +-- απογραφή / στόχος --> [n4] Μήτρα διεπαφών [REQUIRED]\n\n[n5] Atoll / mcSON [REQUIREMENT]\n  +-- συμφωνία / στόχος --> [n4] Μήτρα διεπαφών [REQUIRED] (αναφορά)\n\n[n6] eSurvey / Cronoss / OSS [PROPOSAL]"},{"question":21,"slug":"q21-model-validation","title":"Έλεγχος αλλαγής μοντέλου","summary":"Νέο μοντέλο σημαίνει ελεγχόμενη αλλαγή εξάρτησης, με δοκιμές ποιότητας/ασφάλειας και σύγκριση με λύση χωρίς LLM.","nodes":[{"id":"n1","label":"Υποψήφιο μοντέλο","detail":"Έκδοση και δυνατότητες","status":"DESIGNED","type":"cloud","slot":0},{"id":"n2","label":"Golden Set και ασφάλεια","detail":"Αναμενόμενα αποτελέσματα SME","status":"REQUIRED","type":"security","slot":1},{"id":"n3","label":"Σύγκριση λύσεων","detail":"Ποιότητα / latency / κόστος","status":"REQUIRED","type":"backend","slot":2},{"id":"n4","label":"UAT / shadow / canary","detail":"Δοκιμή χωρίς άμεση αντικατάσταση","status":"DESIGNED","type":"cloud","slot":3},{"id":"n5","label":"Έγκριση και αλλαγή","detail":"Ρύθμιση Router / index alias","status":"DESIGNED","type":"security","slot":4},{"id":"n6","label":"Παρακολούθηση / rollback","detail":"Μόνο όσο υπάρχει παλιά έκδοση","status":"DESIGNED","type":"backend","slot":5}],"edges":[{"from":"n1","to":"n2","label":"δοκιμές","target":true},{"from":"n2","to":"n3","label":"μετρήσεις","target":true},{"from":"n3","to":"n4","label":"επικύρωση","target":true},{"from":"n4","to":"n5","label":"αποδοχή","target":true},{"from":"n5","to":"n6","label":"έλεγχος","target":true}],"notes":["DESIGNED (σχεδιασμένη) συνολική διαδικασία· αλλαγές μοντέλου έχουν δοκιμαστεί στην ανάπτυξη, όχι πλήρης παραγωγική σύγκριση πριν/μετά.","Με σταθερά δεδομένα, γνώση και C#, αλλαγή μοντέλου εξήγησης δεν πρέπει να αλλάζει απόφαση AGG-01.","Embeddings (διανυσματικές αναπαραστάσεις): ξεχωριστός νέος δείκτης, έλεγχος ανάκτησης, αλλαγή alias (δείκτη έκδοσης), ποτέ ανάμειξη ασύμβατων χώρων.","Ο verifier (ελεγκτής μοντέλου) δεν είναι ground truth (αλήθεια αναφοράς). Απόσυρση μοντέλου μπορεί να καταστήσει αδύνατο το rollback (επαναφορά)."],"geometry":{"edge3":{"labelAt":[1095,280]}},"source":{"title":"Validation/regression before changing the LLM or embedding model in Production","body":"**Answer.** A model change is a controlled software-dependency change: register the candidate\nmodel/version → deterministic compatibility tests → offline Golden Set → quality comparison against\nthe current production model → evidence correctness, tool-call correctness, policy/safety failures,\nlatency and token/cost profile measured → adversarial/prompt-injection tests → UAT deployment →\noptional shadow/canary → acceptance → promote the model-routing configuration → monitor early\nProduction traffic → retain a rollback configuration. Embedding-model changes carry additional\ncontrols — never mixing incompatible vector spaces in one index — building a new side-by-side vector\nindex, evaluating retrieval recall/precision against the old, running through UAT, and switching via an\natomic alias with the old index retained through the rollback window. **Current state.** Development model configuration changes have been exercised, but a full\nGolden-Set-based before/after Production model-change comparison has not. The complete release\nprocess remains **DESIGNED**; details are in Appendix B4.\n\n**Target / remaining gap.** Govern actual provider versions and upgrade policies, monitor retirement\nnotices and validate replacements before retirement. Rollback requires the previous model to remain\navailable at the provider; retaining a routing configuration is not enough.\n\nThe additional response's AGG-01 decision-invariance check is useful: hold facts, approved knowledge\nand executable rules fixed, then verify that changing an optional explanation model cannot alter the\ndecision. Record the actual Golden Set version, case count and results rather than treating the\nsource's \"12 scenarios\" as a permanent coverage guarantee. Overall acceptance rate alone is not enough:\nrelease gates must separately cover safety, evidence fidelity and per-scenario regressions.\n\nAlso compare each proposed model use against a non-LLM baseline. For AGG-01 wording, compare with\nfixed templates using answer correctness/clarity, engineer task time, correction rate, response time\nand cost. For general chat, test grounding and permitted tool selection; for `Verify`, test false\nrejections, missed defects and unavailable/malformed verdicts. A model verifier is an additional check,\nnot the source of ground truth for its own evaluation. Expert-approved expected outcomes remain needed.","sha256":"4bf40ed3c46ed720f50a5bc952e9efcc59ce8f0cc7292c92c057e85c58cdca5c"},"textDiagram":"[n1] Υποψήφιο μοντέλο [DESIGNED]\n  +-- δοκιμές / στόχος --> [n2] Golden Set και ασφάλεια [REQUIRED]\n  |   +-- μετρήσεις / στόχος --> [n3] Σύγκριση λύσεων [REQUIRED]\n  |   |   +-- επικύρωση / στόχος --> [n4] UAT / shadow / canary [DESIGNED]\n  |   |   |   +-- αποδοχή / στόχος --> [n5] Έγκριση και αλλαγή [DESIGNED]\n  |   |   |   |   +-- έλεγχος / στόχος --> [n6] Παρακολούθηση / rollback [DESIGNED]"},{"question":22,"slug":"q22-knowledge-currency","title":"Εγκεκριμένη έκδοση και παλαιότητα","summary":"Το pinning (δέσμευση έκδοσης) εξασφαλίζει ποια γνώση χρησιμοποιήθηκε, όχι ότι δεν έχει λήξει ή ανακληθεί.","nodes":[{"id":"n1","label":"Νέα εκτέλεση","detail":"Επίλυση Active release","status":"BUILT","type":"backend","slot":0},{"id":"n2","label":"Έλεγχος γνώσης","detail":"Έγκριση / ανάκληση / hash","status":"BUILT","type":"security","slot":1},{"id":"n3","label":"Pin έκδοσης","detail":"Ακριβής δέσμευση γνώσης","status":"BUILT","type":"database","slot":2},{"id":"n4","label":"Temporal retry","detail":"Κρατά το ίδιο pin","status":"BUILT","type":"backend","slot":3},{"id":"n5","label":"Πολιτική παλαιότητας","detail":"Ημερομηνίες / συμβατότητα","status":"DESIGNED","type":"security","slot":4},{"id":"n6","label":"Απόσυρση προβολών","detail":"Δείκτες / γράφος / ιστορικό","status":"DESIGNED","type":"database","slot":5}],"edges":[{"from":"n1","to":"n2","label":"επικύρωση","target":false},{"from":"n2","to":"n3","label":"δέσμευση","target":false},{"from":"n3","to":"n4","label":"επανάληψη","target":false},{"from":"n5","to":"n2","label":"επιπλέον όριο","target":true},{"from":"n6","to":"n5","label":"χωριστή πολιτική","target":true}],"notes":["BUILT (υλοποιημένα): έγκριση, υπερκάλυψη, καταργημένο περιεχόμενο, αποτυπώματα και ετοιμότητα προβολών.","DESIGNED (σχεδιασμένα): καθολικές ημερομηνίες ισχύος/επιθεώρησης και αυτόματη ανίχνευση παλαιών πηγών.","Το αρχικό pin δεν είναι γενική άδεια χρήσης περιεχομένου που απαγορεύει πλέον η πολιτική.","Ενεργοποίηση νέας έκδοσης δεν αποδεικνύει φυσική διαγραφή παλαιών διανυσμάτων ή κόμβων γράφου."],"geometry":{"edge3":{"labelAt":[1095,280]}},"source":{"title":"Detecting obsolete rules/knowledge and preventing stale-knowledge recommendations","body":"**Answer.** **BUILT:** approved-release resolution, immutable version pinning, integrity checks and\nexplicit lifecycle controls. OKF objects have identifiers, governance/approval metadata, version and\nhash information. The PoTP authority validator checks approval, supersession, deprecated content,\nhashes and projection readiness. These controls do not establish that every object has an effective\ndate, review deadline or equipment/software compatibility constraint, nor that those fields are\nautomatically enforced.\n\nA new governed execution resolves the Active authority release and pins its exact version. Temporal\nretries retain the original pin instead of silently switching to a newly Active release; the resolver\nalso supports lookup of that exact pinned version. Explicit revocation/supersession and validation\nremain separate controls: a recorded pin is not blanket permission to use content rejected by policy.\nAudit inspection of historical evidence is distinct from authorising a new recommendation.\nImplementation evidence is in Appendix B2.\n\n**DESIGNED:** mandatory effective-from/to and review-date metadata, version-compatibility enforcement,\nautomatic detection of obsolete source revisions, and a date-based staleness gate that refuses or\nescalates expired knowledge. Activation of a new release does not by itself prove physical deletion\nor tombstoning of old vector chunks/graph nodes. Projection retirement, historical retention and the\nhandling of in-flight workflows need explicit policy and tests. Until then, owners must review\ncurrency and explicitly withdraw or supersede outdated knowledge.","sha256":"b52608927b8f0f0002a95c177750b2d0dbec6e5fc706b6484bfd83a9ec90eaec"},"textDiagram":"[n1] Νέα εκτέλεση [BUILT]\n  +-- επικύρωση --> [n2] Έλεγχος γνώσης [BUILT]\n  |   +-- δέσμευση --> [n3] Pin έκδοσης [BUILT]\n  |   |   +-- επανάληψη --> [n4] Temporal retry [BUILT]\n\n[n6] Απόσυρση προβολών [DESIGNED]\n  +-- χωριστή πολιτική / στόχος --> [n5] Πολιτική παλαιότητας [DESIGNED]\n  |   +-- επιπλέον όριο / στόχος --> [n2] Έλεγχος γνώσης [BUILT] (αναφορά)"},{"question":23,"slug":"q23-rollback","title":"Επαναφορά συμβατού συνόλου","summary":"Ασφαλές rollback (επαναφορά) απαιτεί συμβατές εκδόσεις εφαρμογής, κανόνων, γνώσης, προβολών και μοντέλων.","nodes":[{"id":"n1","label":"Release manifest","detail":"Συμβατό σύνολο εκδόσεων","status":"DESIGNED","type":"database","slot":0},{"id":"n2","label":"Εφαρμογή και C#","detail":"Προηγούμενη συμβατή εικόνα","status":"DESIGNED","type":"backend","slot":1},{"id":"n3","label":"Γνώση και προβολές","detail":"OKF / vector index / alias","status":"DESIGNED","type":"database","slot":2},{"id":"n4","label":"Router και μοντέλο","detail":"Παλιά έκδοση αν διατίθεται","status":"CONDITIONAL","type":"cloud","slot":3},{"id":"n5","label":"Σχήμα βάσης","detail":"Σχέδιο ανάκτησης μεταβολών","status":"CONDITIONAL","type":"database","slot":4},{"id":"n6","label":"Δοκιμή σε παραγωγική τοπολογία","detail":"Κοινή επαλήθευση ανάκτησης","status":"PENDING","type":"security","slot":5}],"edges":[{"from":"n1","to":"n2","label":"επιλέγει","target":true},{"from":"n2","to":"n3","label":"συμβατότητα","target":true},{"from":"n3","to":"n4","label":"συμβατότητα","target":true},{"from":"n4","to":"n5","label":"συντονισμός","target":true},{"from":"n5","to":"n6","label":"επαλήθευση","target":true}],"notes":["Το διάγραμμα είναι σύνολο εξαρτήσεων επαναφοράς, όχι απαίτηση σειριακής αλλαγής όλων των στοιχείων.","Υπάρχει ιστορικό Kubernetes αναθεωρήσεων στην ανάπτυξη, όχι πλήρης παραγωγική πρόβα.","Alias (δείκτης έκδοσης) γνώσης δεν επαναφέρει C#. Αλλαγή και των δύο απαιτεί ελεγμένο ζεύγος γνώσης/εφαρμογής.","Μεταβολές βάσης αναστρέφονται υπό όρους. Απόσυρση μοντέλου από πάροχο περιορίζει πραγματικά τη δυνατότητα επαναφοράς."],"geometry":{"edge3":{"labelAt":[1095,280]}},"source":{"title":"Rollback of application, rules/knowledge, and model configuration","body":"**Answer.** Rollback is designed as a first-class capability, independently for: application containers\n(previous signed image/Helm release), agent definitions (versioned manifest), prompt templates\n(versioned config), policy (versioned package, subject to compatibility), executable C# rules (the\ncompatible application image today; independent declarative rule bundles remain a target), OKF\nknowledge bundles (immutable bundle plus alias), the vector index (alias switch), model\nrouting configuration (previous routing manifest), and model deployment (route to the previous\ndeployment where the provider version is still available); database schema migrations are rolled back\nconditionally, following an expand/contract pattern with no destructive migration shipped in the same\nrelease without a recovery plan. Independent rollback is only safe within a stated compatibility\nmatrix carried in the release manifest.\n\n**Current state.** Development Kubernetes revision history exists (Appendix B4), but does not prove\na successful rollback across all dependent artifacts.\n\n**Target / remaining gap.** Rehearse rollback against the deployed Production topology, proving image,\napplication configuration and compatible knowledge/model configuration recovery together.\nA knowledge alias alone does\nnot roll back executable C# rule logic.\n\nIf a business-rule change spans OKF and C#, the release and rollback targets must retain a reviewed,\ncompatible pair of knowledge and application versions. Restoring only one side can recreate the\nsemantic drift described in Q6 even when all artifact hashes are valid.","sha256":"fab55c6be92c85afcdb10d1ae7cab971523201ff16863c42006937a23cf3b829"},"textDiagram":"[n1] Release manifest [DESIGNED]\n  +-- επιλέγει / στόχος --> [n2] Εφαρμογή και C# [DESIGNED]\n  |   +-- συμβατότητα / στόχος --> [n3] Γνώση και προβολές [DESIGNED]\n  |   |   +-- συμβατότητα / στόχος --> [n4] Router και μοντέλο [CONDITIONAL]\n  |   |   |   +-- συντονισμός / στόχος --> [n5] Σχήμα βάσης [CONDITIONAL]\n  |   |   |   |   +-- επαλήθευση / στόχος --> [n6] Δοκιμή σε παραγωγική τοπολογία [PENDING]"},{"question":24,"slug":"q24-performance","title":"Αρχικοί στόχοι επιδόσεων UAT","summary":"Οι τιμές p95 είναι προτεινόμενοι στόχοι σχεδιασμού, όχι μετρημένα SLOs ή εγγυημένοι μέγιστοι χρόνοι.","nodes":[{"id":"n1","label":"Ορισμός φόρτου","detail":"Αιτήματα / μήκη / concurrency","status":"REQUIRED","type":"external","slot":0},{"id":"n2","label":"Υποψήφιοι στόχοι p95","detail":"Αρχικές τιμές συζήτησης","status":"PROPOSAL","type":"backend","slot":1},{"id":"n3","label":"Μετρήσεις UAT","detail":"p50 / p95 / p99 / ουρές","status":"PENDING","type":"backend","slot":2},{"id":"n4","label":"Συμφωνία SLO","detail":"Στόχος επιπέδου υπηρεσίας","status":"PENDING","type":"security","slot":3},{"id":"n5","label":"Timeout / async","detail":"Όριο αναμονής / ασύγχρονη ροή","status":"DESIGNED","type":"backend","slot":4},{"id":"n6","label":"Work Order DryRun","detail":"2s p95 πρόταση προεπισκόπησης","status":"PROPOSAL","type":"backend","slot":5}],"edges":[{"from":"n1","to":"n2","label":"συνθήκες","target":true},{"from":"n2","to":"n3","label":"επικύρωση","target":true},{"from":"n3","to":"n4","label":"τεκμήρια","target":true},{"from":"n5","to":"n4","label":"χωριστή απόφαση","target":true},{"from":"n6","to":"n5","label":"όχι write SLA","target":true}],"notes":["AGG-05 πρώτο token 2s, πλήρης απάντηση 10s· AGG-01 απόφαση χωρίς εξήγηση 4s· MW-02 \u003c10s· μαζική επεξεργασία 5s ανά σταθμό.","Έλεγχος συνέπειας: ασύγχρονος, στόχος ολοκλήρωσης προς συμφωνία. Οι τιμές δεν αποδεικνύουν λειτουργικό σενάριο.","Work Order 2s αφορά μόνο DryRun (δοκιμαστική εκτέλεση χωρίς εγγραφή), μετά την ανθρώπινη έγκριση. Πραγματική εγγραφή θέλει άλλο στόχο.","Timeout (όριο αναμονής) δεν εγγυάται ολοκλήρωση. Το 202 Accepted παραμένει στόχος σύμβασης, όχι καθολικά υλοποιημένη συμπεριφορά."],"geometry":{"edge3":{"labelAt":[1095,280]}},"source":{"title":"Target response times and maximum interactive latency","body":"**Answer.** The table contains **initial performance objectives to be validated in UAT**. These\ncandidate p95 design objectives are discussion inputs, not measured SLOs, contractual SLAs or\nguaranteed maximum response times. They do not establish that the scenarios are operational.\n\n| Use case / measurement | Candidate p95 objective | Scope / qualification |\n|---|---:|---|\n| AGG-05 chat, first token | 2s | Define whether authentication, retrieval and tool work are included |\n| AGG-05 chat, complete streamed answer | 10s | Fix input/output length and tool-call workload |\n| AGG-01 deterministic PoTP recommendation | 4s | Core decision, excluding optional model explanation |\n| MW-02 link availability query | \u003c10s | Validate against the actual integration |\n| Mass generation, per-site processing | 5s | Individual site samples; also measure total batch duration |\n| Consistency run | Not yet set | Asynchronous progress/status and completion objective to agree |\n| Work Order DryRun preview, after approval | 2s | No persisted NCTSite write; excludes human review time |\n\n**Current state.** No benchmark results establishing these values are asserted here. A DryRun result\ncannot establish actual-write latency; any future authorised write path needs its own acceptance\nobjective and tests (Q16).\n\n**Target / remaining gap.** UAT must measure p50/p95/p99 under agreed arrival rates, concurrency,\ninput/output lengths, provider RPM/TPM, queues and retries (Q3). Agree timeouts and asynchronous\ntransition thresholds separately; a timeout is not a guarantee of completion. Longer workflows\nshould use durable jobs with run IDs and progress. A `202 Accepted` response remains a target API\ncontract, not a verified behaviour of every scenario endpoint.","sha256":"35e04a1cdf13233d63d2f4851bc5ce5d64e3e85ba38d08805ac076005697b7cf"},"textDiagram":"[n1] Ορισμός φόρτου [REQUIRED]\n  +-- συνθήκες / στόχος --> [n2] Υποψήφιοι στόχοι p95 [PROPOSAL]\n  |   +-- επικύρωση / στόχος --> [n3] Μετρήσεις UAT [PENDING]\n  |   |   +-- τεκμήρια / στόχος --> [n4] Συμφωνία SLO [PENDING]\n\n[n6] Work Order DryRun [PROPOSAL]\n  +-- όχι write SLA / στόχος --> [n5] Timeout / async [DESIGNED]\n  |   +-- χωριστή απόφαση / στόχος --> [n4] Συμφωνία SLO [PENDING] (αναφορά)"},{"question":25,"slug":"q25-cost-attribution","title":"Χρήση, εκτίμηση και πραγματική χρέωση","summary":"Το invocation ledger (μητρώο κλήσεων) είναι υλοποιημένο, όχι πλήρες σύστημα κατανομής κόστους ή επιβολής προϋπολογισμού.","nodes":[{"id":"n1","label":"Κλήση μοντέλου","detail":"Χρήση από πάροχο όπου υπάρχει","status":"BUILT","type":"cloud","slot":0},{"id":"n2","label":"Invocation ledger","detail":"Μητρώο κλήσεων / πληρότητα","status":"BUILT","type":"database","slot":1},{"id":"n3","label":"Εκτίμηση τιμοκαταλόγου","detail":"Εκδομένη τιμή, όχι τιμολόγιο","status":"BUILT","type":"backend","slot":2},{"id":"n4","label":"Πραγματική χρέωση","detail":"Συμφωνία με Azure billing","status":"PENDING","type":"external","slot":3},{"id":"n5","label":"Απόδοση κόστους","detail":"Χρήστης / σενάριο / περιβάλλον","status":"INCOMPLETE","type":"backend","slot":4},{"id":"n6","label":"Όρια δαπάνης","detail":"Άρνηση / ουρά / υποβάθμιση","status":"DESIGNED","type":"security","slot":5}],"edges":[{"from":"n1","to":"n2","label":"καταγραφή","target":false},{"from":"n2","to":"n3","label":"υπολογισμός","target":false},{"from":"n3","to":"n4","label":"συμφωνία","target":true},{"from":"n2","to":"n5","label":"ταυτοποίηση","target":true},{"from":"n6","to":"n5","label":"προϋπολογισμός","target":true}],"notes":["Ορισμένες κλήσεις δείχνουν υπηρεσία αντί τελικού μηχανικού. Χρειάζεται συνεπής διάδοση ταυτότητας και execution/trace IDs (αναγνωριστικών εκτέλεσης/ίχνους).","Μετρημένη χρήση και εκτιμώμενο κόστος παραμένουν διακριτά. Ελλείπουσα χρήση διατηρεί ένδειξη προέλευσης/πληρότητας.","Alerts (ειδοποιήσεις) και provisioned throughput (δεσμευμένη ρυθμαπόδοση) δεν αποτελούν πλήρες hard budget (αυστηρό όριο δαπάνης).","Η παραδοχή 50% των tokens για AGG-05 χρειάζεται μέτρηση. Οι έλεγχοι πρέπει να καλύπτουν και εναλλακτικές διαδρομές."],"geometry":{"edge3":{"labelAt":[1095,280]},"edge4":{"labelAt":[640,280]}},"source":{"title":"Monitoring and limiting LLM consumption/cost per user, use case and environment","body":"**Answer.** Usage recording exists, but it is not a complete billing-attribution or budget-enforcement\nsystem.\n\n**Current state: BUILT.** The invocation ledger records usage and price-based estimates. End-user,\nrole and environment attribution is not guaranteed on every invocation; some paths identify the\ncalling service rather than the initiating engineer. Token usage is measured where the provider\nreports it, with source/completeness recorded for missing or estimated values. Price-based cost\nremains an estimate, not a reconciled Azure charge (Appendix B6).\n\n**DESIGNED / incomplete:** complete per-user/use-case/environment cost reporting and budget enforcement.\nBefore a FinOps dashboard can provide reliable attribution, callers must consistently propagate\nauthenticated user or service identity, environment, use case, execution and trace correlation.\nA chart over the current tables alone cannot fill missing identity data.\n\nThe target controls include separate environment/model quotas and budgets, per-user/role rate and\nconcurrency limits, per-use-case input/output and model-call budgets, permitted model classes,\nand retrieval/context limits. Their enforcement and denial behaviour must be tested independently;\nthe ledger proves recording capability, not that all budget controls are active.\n\nThe source's assumption that AGG-05 consumes approximately 50% of tokens needs measurement. Provisioned\nthroughput is a capacity choice, not a complete spend cap; alerts are not request-denial controls.\nAny hard budget must define whether new requests are refused, queued or degraded, cover fallback\nroutes, and be reconciled with actual billing. No such universal enforcement is asserted here.","sha256":"c5f35ee0ba58c14af8ef0bd474714cf0a35a5c1471bd5a73dcca1656eab77fb0"},"textDiagram":"[n1] Κλήση μοντέλου [BUILT]\n  +-- καταγραφή --> [n2] Invocation ledger [BUILT]\n  |   +-- υπολογισμός --> [n3] Εκτίμηση τιμοκαταλόγου [BUILT]\n  |   |   +-- συμφωνία / στόχος --> [n4] Πραγματική χρέωση [PENDING]\n  |   +-- ταυτοποίηση / στόχος --> [n5] Απόδοση κόστους [INCOMPLETE]\n\n[n6] Όρια δαπάνης [DESIGNED]\n  +-- προϋπολογισμός / στόχος --> [n5] Απόδοση κόστους [INCOMPLETE] (αναφορά)"},{"question":26,"slug":"q26-security-patching","title":"Ενημερώσεις ασφαλείας και υπογραφές","summary":"Επιτυχής σάρωση ευπαθειών δεν αποδεικνύει υπογεγραμμένη εικόνα ή επιβολή πολιτικής στο cluster (συστάδα).","nodes":[{"id":"n1","label":"SBOM και scans","detail":"Κατάλογος λογισμικού / σαρώσεις","status":"BUILT","type":"backend","slot":0},{"id":"n2","label":"Εκτίμηση CVE","detail":"Σοβαρότητα / έκθεση / ιδιοκτήτης","status":"REQUIRED","type":"security","slot":1},{"id":"n3","label":"Διόρθωση και δοκιμές","detail":"Έκτακτη ή τακτική συντήρηση","status":"REQUIRED","type":"backend","slot":2},{"id":"n4","label":"Υπογραφή / επαλήθευση","detail":"Μη αποδεδειγμένη επιτυχής διάθεση","status":"BLOCKED","type":"security","slot":3},{"id":"n5","label":"Admission / εγκατάσταση","detail":"Πολιτική εισαγωγής εικόνων","status":"VERIFY","type":"cloud","slot":4},{"id":"n6","label":"Παρακολούθηση εκδόσεων","detail":"AKS / .NET / βάσεις / mesh","status":"REQUIRED","type":"database","slot":5}],"edges":[{"from":"n1","to":"n2","label":"εύρημα","target":false},{"from":"n2","to":"n3","label":"προτεραιότητα","target":true},{"from":"n3","to":"n4","label":"παραδοτέο","target":true},{"from":"n4","to":"n5","label":"υπογραφή","target":true},{"from":"n5","to":"n6","label":"συντήρηση","target":true}],"notes":["BUILT (υλοποιημένο): έλεγχοι ασφαλείας CI. images-signed και signatures-verified παραμένουν blocked (μπλοκαρισμένα).","24-72 ώρες για κρίσιμα εκμεταλλεύσιμα προβλήματα όπου εφικτό είναι στόχος συζήτησης, όχι δεσμευτικό SLA.","Εξαίρεση CVE (γνωστής ευπάθειας) απαιτεί υπεύθυνο, αιτιολόγηση, αντισταθμιστικό έλεγχο, λήξη και επανεκτίμηση.","Η παύση DEV cluster δεν καταργεί ενημερώσεις εικόνων/εξαρτήσεων. Οι προτεινόμενες εβδομαδιαίες/μηνιαίες/τριμηνιαίες συχνότητες δεν είναι επαληθευμένο πρόγραμμα."],"geometry":{"edge3":{"labelAt":[1095,280]}},"source":{"title":"Vulnerability patching and security updates for containers and platform components","body":"**Answer.** CI includes SBOM and vulnerability/security scanning controls; the readiness record marks\n`vulnerability-gates: met`. Successful scans are distinct from image signing and admission enforcement.\nSigning/verification mechanisms exist, but `images-signed` and `signatures-verified` remain `blocked`:\na successful signed-image release and verification have not been demonstrated. Production admission\npolicy, minimal/non-root containers and immutable image references must be verified in the target\ncluster rather than inferred from a passing scan. The patch lifecycle assesses each detected CVE for\nseverity/exposure:\na critical/actively exploitable issue triggers an emergency release, a high-severity issue triggers an\naccelerated patch, and medium/low issues follow normal maintenance — recommended operating targets for\ndiscussion are 24–72 hours for critical exploitable issues where feasible, an agreed SLA for\nhigh-severity issues, and scheduled monthly maintenance for\nroutine dependencies/base images. Platform-component versions are tracked: AKS, Kubernetes/node images,\nPostgreSQL minor versions, Temporal releases, Redis service lifecycle, Istio/mesh versions, the .NET\nruntime, ingress/gateway, and base Linux images. An accepted CVE exception needs an owner, a business\nreason, a compensating control, an expiration date and a reassessment. This applies to the already-\ndeployed AKS workload estate, not only future containers: for the non-production cluster, vulnerability\nmanagement continues against the image registry/SBOM even while compute is stopped — a stopped cluster\nreduces runtime cost, not the need to patch stored images and dependencies before the next startup.\nImage signing (`images-signed`) has not yet executed in a workflow, though the identity to sign now\nexists; the exact patch SLA follows Telekom policy. The new response's weekly image rebuilds,\nquarterly Kubernetes upgrades and monthly node patching are candidate maintenance cadences, not\nverified schedules. Assign owners, support-window constraints and emergency exceptions; a registry\npush or managed-service label alone does not prove the corresponding security gate or patch schedule.","sha256":"344cc138c752770792ea394b4b910f1e3998312dd52c6a87ba26f90f20c93389"},"textDiagram":"[n1] SBOM και scans [BUILT]\n  +-- εύρημα --> [n2] Εκτίμηση CVE [REQUIRED]\n  |   +-- προτεραιότητα / στόχος --> [n3] Διόρθωση και δοκιμές [REQUIRED]\n  |   |   +-- παραδοτέο / στόχος --> [n4] Υπογραφή / επαλήθευση [BLOCKED]\n  |   |   |   +-- υπογραφή / στόχος --> [n5] Admission / εγκατάσταση [VERIFY]\n  |   |   |   |   +-- συντήρηση / στόχος --> [n6] Παρακολούθηση εκδόσεων [REQUIRED]"},{"question":27,"slug":"q27-upgrade-contracts","title":"Αναβαθμίσεις πίσω από σταθερή σύμβαση","summary":"Οι εσωτερικές αλλαγές NCTSite απομονώνονται με επιμελημένες όψεις/APIs, όχι με άμεση εξάρτηση από αυθαίρετους πίνακες.","nodes":[{"id":"n1","label":"NCTSite εσωτερικό σχήμα","detail":"Φυσικοί πίνακες","status":"CURRENT","type":"database","slot":0},{"id":"n2","label":"Σταθερές όψεις / APIs","detail":"Έκδοση σύμβασης δεδομένων","status":"PARTIAL","type":"backend","slot":1},{"id":"n3","label":"MCP και κανόνες C#","detail":"Συμφωνημένα πεδία / σημασία","status":"BUILT","type":"backend","slot":2},{"id":"n4","label":"Δοκιμές υποψήφιας αλλαγής","detail":"Τύποι / μονάδες / null / freshness","status":"REQUIRED","type":"security","slot":3},{"id":"n5","label":"UAT και Golden Set","detail":"Μη παλινδρόμηση / απόδοση","status":"REQUIRED","type":"backend","slot":4},{"id":"n6","label":"Ελεγχόμενη αναβάθμιση","detail":"Αυτοματοποιημένη πύλη εκκρεμεί","status":"DESIGNED","type":"cloud","slot":5}],"edges":[{"from":"n1","to":"n2","label":"απομόνωση","target":false},{"from":"n2","to":"n3","label":"σύμβαση","target":false},{"from":"n3","to":"n4","label":"συμβατότητα","target":true},{"from":"n4","to":"n5","label":"αποδοχή","target":true},{"from":"n5","to":"n6","label":"έγκριση","target":true}],"notes":["Οι επιμελημένες όψεις έχουν χρησιμοποιηθεί ζωντανά στην ανάπτυξη. Η σημερινή επανεκτέλεση δοκιμών σύμβασης είναι χειροκίνητη.","DESIGNED (σχεδιασμένη): αυτόματη pre-upgrade regression (δοκιμή μη παλινδρόμησης πριν αναβάθμιση) στο υποψήφιο σχήμα.","Ίδια ονόματα/τύποι μπορεί να κρύβουν διαφορετικές μονάδες, null semantics (σημασία κενών τιμών), φίλτρα ή παλαιότητα.","Αν δεν διατηρείται η σύμβαση, απαιτείται νέα έκδοση και συντονισμένη αλλαγή API/MCP/κανόνων, όχι υπόθεση πλήρους διαφάνειας."],"geometry":{"edge3":{"labelAt":[1095,280]}},"source":{"title":"Protecting curated views, MCP interfaces and deterministic rules from NCTSite/Oracle upgrades","body":"**Answer.** The key is a stable anti-corruption/contract layer: NCTSite's internal tables feed curated\nviews/APIs, which feed the NCT-AI contract, which feeds MCP tools and deterministic rules — NCT-AI\nnever depends directly on arbitrary internal physical table layouts. Controls: versioned curated views,\nan explicit interface contract, schema-compatibility tests, an Oracle contract test suite, test-data\nfixtures, pre-upgrade UAT regression, a dependency manifest, backward-compatible view changes, and\nchange notification from the NCTSite/DB owners. Before an upgrade: object-existence tests, column-type\ntests, sample-query tests, semantic data tests, the agent Golden Set, and performance tests all run; if\nNCTSite must change a physical schema, the existing curated contract is maintained so NCT-AI continues\nunchanged, and a new contract version is introduced only for an intentional breaking semantic change.\n**DESIGNED**, matching this pattern; the curated views themselves exist and have been queried live\n(Q16), which is stronger evidence than a design intention — what remains is an automated pre-upgrade\nregression suite running the Oracle contract tests against a candidate schema before an upgrade ships;\ntoday that is a manual re-run of the existing contract test suite. Passing the existing Golden Set\ndoes not prove every schema change is transparent: unchanged field names/types can hide changed\nunits, null semantics, filtering or freshness. Extend the contract and regression cases for the actual\nupgrade, and coordinate API/MCP/rule changes when the stable contract cannot be preserved.","sha256":"81fc0b93220556ba22fb75c9f97d96b8de5dc9a570e20d29131111f78b8a0d32"},"textDiagram":"[n1] NCTSite εσωτερικό σχήμα [CURRENT]\n  +-- απομόνωση --> [n2] Σταθερές όψεις / APIs [PARTIAL]\n  |   +-- σύμβαση --> [n3] MCP και κανόνες C# [BUILT]\n  |   |   +-- συμβατότητα / στόχος --> [n4] Δοκιμές υποψήφιας αλλαγής [REQUIRED]\n  |   |   |   +-- αποδοχή / στόχος --> [n5] UAT και Golden Set [REQUIRED]\n  |   |   |   |   +-- έγκριση / στόχος --> [n6] Ελεγχόμενη αναβάθμιση [DESIGNED]"},{"question":28,"slug":"q28-sourcing","title":"Επιλογές προμήθειας και βάση γράφου","summary":"Το μικτό μοντέλο διαχειριζόμενων και ανοικτών υπηρεσιών χρειάζεται λειτουργική αξιολόγηση, όχι μόνο σύγκριση αδειών.","nodes":[{"id":"n1","label":"Επιλογή Telekom","detail":"Λειτουργία / υποστήριξη / κόστος","status":"PENDING","type":"external","slot":0},{"id":"n2","label":"Open source","detail":".NET / PostgreSQL / Temporal","status":"OPTION","type":"backend","slot":1},{"id":"n3","label":"Managed Azure","detail":"AKS / Redis / AI / Storage","status":"OPTION","type":"cloud","slot":2},{"id":"n4","label":"Τρέχον πρότυπο γράφου","detail":"Μόνο Apache AGE","status":"TARGET","type":"database","slot":3},{"id":"n5","label":"Neo4j Aura","detail":"Παλαιότερη χρήση ανάπτυξης","status":"HISTORICAL","type":"database","slot":4},{"id":"n6","label":"Adapter Neo4j","detail":"Διαλειτουργικότητα / δοκιμές","status":"RETAINED","type":"backend","slot":5}],"edges":[{"from":"n1","to":"n2","label":"επιλογή","target":false},{"from":"n2","to":"n3","label":"εναλλακτικές","target":false},{"from":"n3","to":"n4","label":"πρότυπο","target":false},{"from":"n5","to":"n4","label":"νεότερη απόφαση","target":false},{"from":"n5","to":"n6","label":"διατηρείται","target":false}],"notes":["Open source (ανοικτός κώδικας) δεν σημαίνει μηδενικό TCO (συνολικό κόστος ιδιοκτησίας). Λειτουργία, αντίγραφα και ενημερώσεις παραμένουν.","Neo4j χρησιμοποιήθηκε/αξιολογήθηκε στην ανάπτυξη. AGE-only (μόνο AGE) είναι σημερινός στόχος εγκατάστασης, όχι άρνηση του ιστορικού.","Η δυνατότητα διακυβέρνησης γνώσης είναι απαραίτητη, όχι υποχρεωτικά η μορφή OKF. Git και μητρώο εγκρίσεων είναι εναλλακτική που απαιτεί προσαρμογή.","Η επιλογή OKF δεν δικαιολογεί από μόνη της Knowledge Graph (γράφο γνώσης). Χρειάζονται συγκεκριμένα ερωτήματα/εξαρτήσεις."],"geometry":{"edge3":{"labelAt":[1095,280]}},"source":{"title":"Open-source/self-hosted vs managed/commercial components","body":"**Answer.** The platform supports a mixed sourcing model. Open-source/self-hostable: .NET/ASP.NET,\nKubernetes, Istio, PostgreSQL, pgvector, Apache AGE (Apache 2.0), Temporal Server (MIT-licensed),\nOpenTelemetry. Managed/commercial with an Azure equivalent: AKS (managed Kubernetes), Azure Database\nfor PostgreSQL (with pgvector and, on supported versions, Apache AGE), Azure Managed Redis, Azure\nOpenAI/Foundry models, Entra ID, Azure Storage/ACR/Key Vault, and Azure Monitor/Dynatrace as an\nOpenTelemetry backend option. Temporal Cloud exists as the managed alternative to self-hosting the MIT\nserver. Open source does not mean zero TCO — self-hosted components still need operations, backups,\nmonitoring, patching, capacity planning and engineering support. Final sourcing decisions belong to Telekom.\n\n**Current target and history.** Neo4j was previously used/evaluated in development, including Aura\nand live integration tests. The current target deployment standard is **Apache AGE only**; the Neo4j\nadapter remains for interoperability/testing. This is a deployment decision, not a claim that Neo4j\nwas never deployed or a fresh inventory of running services. Appendix B7 separates the historical\nevidence from the current standard.\n\n**Target / remaining gap.** Confirm sourcing, supported versions and deployment compliance for each\ncustomer environment before Production.\nProvider abstraction reduces coupling; it does not eliminate migration effort or dependency on managed\nidentity, storage, networking and operational tooling. Existing subscriptions do not automatically\ninclude every required entitlement or support contract.\n\nFor knowledge governance, **the capability is needed, not necessarily the specific OKF format**.\nFor a small, stable rule set, versioned documentation in Git plus a source/version/approval registry\ncould suffice. Replacing OKF would require adapting current contracts and preserving governance\nchecks, not simply deleting the knowledge files. OKF is more justified when many agents and scenarios\nreuse the same curated knowledge through different retrieval methods. Choosing OKF does not itself\nestablish a need for a Knowledge Graph; graph-specific queries and dependencies must justify that\nseparate choice. These are design trade-offs, not a claim that the simpler replacement is implemented.","sha256":"18e92ceae7c6d660e69ad0b4644f0fe0b460e99364bf9cf9c06833c26356c1d8"},"textDiagram":"[n1] Επιλογή Telekom [PENDING]\n  +-- επιλογή --> [n2] Open source [OPTION]\n  |   +-- εναλλακτικές --> [n3] Managed Azure [OPTION]\n  |   |   +-- πρότυπο --> [n4] Τρέχον πρότυπο γράφου [TARGET]\n\n[n5] Neo4j Aura [HISTORICAL]\n  +-- νεότερη απόφαση --> [n4] Τρέχον πρότυπο γράφου [TARGET] (αναφορά)\n  +-- διατηρείται --> [n6] Adapter Neo4j [RETAINED]"},{"question":29,"slug":"q29-total-cost","title":"Συνολικό κόστος χωρίς διπλομέτρηση","summary":"Δεν υπάρχει εγκεκριμένη παραγωγική βάση TCO. Οι εμπορικές εκτιμήσεις δεν είναι πλήρες κόστος ιδιοκτησίας.","nodes":[{"id":"n1","label":"Φάσεις και setup","detail":"EUR 810K-1.07M","status":"ESTIMATE","type":"external","slot":0},{"id":"n2","label":"Δύο έτη υποστήριξης","detail":"Επιπλέον EUR 160-240K","status":"ASSUMPTION","type":"external","slot":1},{"id":"n3","label":"Υποσύνολο","detail":"EUR 970K-1.31M","status":"ESTIMATE","type":"backend","slot":2},{"id":"n4","label":"Πραγματικό TCO","detail":"Φόροι / runtime / εξαιρέσεις","status":"PENDING","type":"security","slot":3},{"id":"n5","label":"Λειτουργία παραγωγής","detail":"EUR 15-30K / μήνα αιχμής","status":"ESTIMATE","type":"cloud","slot":4},{"id":"n6","label":"Μετρημένοι όγκοι","detail":"UAT / tokens / συμβάσεις","status":"REQUIRED","type":"database","slot":5}],"edges":[{"from":"n1","to":"n2","label":"αν πρόσθετα","target":false},{"from":"n2","to":"n3","label":"άθροισμα","target":false},{"from":"n3","to":"n4","label":"συν εξαιρέσεις","target":false},{"from":"n5","to":"n4","label":"προστίθεται","target":false},{"from":"n6","to":"n5","label":"επικύρωση","target":true}],"notes":["ESTIMATE (εκτίμηση), όχι προσφορά. Το EUR 900K-1.1M της πηγής δεν αποτελεί πλήρες τριετές TCO.","36 μήνες σταθερής αιχμής δίνουν EUR 540K-1.08M runtime (λειτουργίας), μόνο αριθμητικό παράδειγμα, όχι πρόβλεψη αύξησης.","Επιβεβαιώνονται επικαλύψεις φάσεων, συμβάσεις υποστήριξης, άδειες, DR (ανάκαμψη), φόροι, εκπτώσεις και χρόνοι διάθεσης.","Τα οφέλη C#/διακυβέρνησης διαχωρίζονται από πρόσθετα οφέλη LLM. Ο προτεινόμενος τρισκελής συγκριτικός προϋπολογισμός δεν έχει ακόμη παραχθεί."],"geometry":{"edge3":{"labelAt":[1095,280]}},"source":{"title":"Licensing, support, recurring costs, and total TCO","body":"**Answer.** A credible TCO figure needs the target Azure region, AKS SKU/node families, UAT and\nProduction availability requirements, PostgreSQL compute/storage, DR region, log retention, model\nchoice, token volume, pay-as-you-go vs provisioned throughput, Temporal self-hosted vs Cloud, support\ncontracts and any on-prem GPU option fixed first; a complete approved Production cost baseline is not\nyet available. The ledger combines provider-reported usage where available with **estimated** cost\nfrom a versioned price table, not freshly verified rates or a reconciled bill (Appendix B6).\nActual expenditure requires Azure billing/Cost Management data, contractual discounts,\ncapacity charges and reconciliation. Annual projections also need measured UAT volumes and documented\nassumptions; neither a per-call estimate nor a historical retail rate establishes total TCO. Temporal's\nsoftware cost is genuinely zero if self-hosted (MIT-licensed server); the operational cost of running it\nis not zero and is not yet estimated. The existing Azure AKS environment is intentionally stopped when\nnot in use, which materially reduces non-production compute cost while some supporting Azure services\ncontinue to bill regardless — Production should not rely on stop/start as a cost-control mechanism,\nbecause its HA/SLO posture differs. Cost buckets to model: AKS/compute, PostgreSQL, Redis, storage,\nobservability, Azure OpenAI/Foundry usage (input + output + embedding tokens, plus any provisioned\ncapacity), Temporal (software cost vs Cloud subscription), CI/CD and security tooling (license\nentitlement and any incremental cost require confirmation), and DR (which materially increases TCO\nthrough warm capacity, replicated data and redundant endpoints). The recommended next deliverable, not yet produced, is a\nthree-scenario cost model — Azure AI cost-optimised, Azure AI production HA/enterprise, and on-prem\nGPU — priced from measured UAT tokens and requests rather than theoretical prompts.\n\n**Commercial proposal from the additional response, not an approved quotation.** These numbers are\nsource-provided estimates, not newly researched market prices or a delivery commitment:\n\n| Item | Proposed duration / scope | Indicative amount |\n|---|---|---:|\n| Phase 1 | Approximately 6 months; AGG-01 advisory-only pilot, no activated write path | EUR 180–220K development |\n| Initial infrastructure setup | Provisioning effort; runtime billed separately | EUR 30–50K |\n| Phase 2 | Approximately 9–12 months; AGG-05, AGG-03, MW-01, AGG-04, AGG-06 | EUR 350–450K |\n| Phase 3 | Years 2–3; RAN-01, RAN-03, RAN-05, RAN-06 and AI-assisted licensing-table work | EUR 250–350K |\n| Support after Year 1 | Year 1 proposed as included; coverage/hours and exclusions unconfirmed | EUR 80–120K/year |\n| Runtime at Production peak | Azure infrastructure and model usage/capacity | EUR 15–30K/month |\n| Source's stated three-year development/support envelope | Not an all-inclusive TCO | EUR 900K–1.1M |\n\n**Arithmetic reconciliation is required.** Phases plus setup sum to EUR 810K–1.07M. If two subsequent\nsupport years are additive, the subtotal becomes EUR 970K–1.31M, before runtime, tax and any excluded\nitems. Separately, 36 months at the stated peak runtime rate would be EUR 540K–1.08M; this is only a\nconstant-peak illustration, not a ramp-up forecast. The quoted EUR 900K–1.1M therefore cannot be used\nas total three-year ownership cost. Confirm overlap/inclusions, staffing, acceptance criteria,\nenvironments, rollout timing, discounts and support coverage before consolidating the budget. Neither\nan existing Enterprise Agreement nor open-source licensing proves there are no additional licence costs.\n\nThe business case should separate the AGG-01 rules/governance baseline from optional LLM features.\nReading structured fields, applying fixed checks and showing a result is not by itself a reason to\nrequire model inference. Budget and justify explanation, chat and verification calls separately using\nthe non-LLM comparisons in Q21; do not count deterministic automation gains as proven LLM gains.","sha256":"88d0e7c36ff4d9acb1c6eb7521446bf56f2090171fd68376931da482c16c07e9"},"textDiagram":"[n1] Φάσεις και setup [ESTIMATE]\n  +-- αν πρόσθετα --> [n2] Δύο έτη υποστήριξης [ASSUMPTION]\n  |   +-- άθροισμα --> [n3] Υποσύνολο [ESTIMATE]\n  |   |   +-- συν εξαιρέσεις --> [n4] Πραγματικό TCO [PENDING]\n\n[n6] Μετρημένοι όγκοι [REQUIRED]\n  +-- επικύρωση / στόχος --> [n5] Λειτουργία παραγωγής [ESTIMATE]\n  |   +-- προστίθεται --> [n4] Πραγματικό TCO [PENDING] (αναφορά)"},{"question":30,"slug":"q30-operating-roles","title":"Ρόλοι και πραγματική λογοδοσία","summary":"Κάθε πύλη έγκρισης χρειάζεται ονομαστικό υπεύθυνο, εξουσία και χρόνο εργασίας, όχι μόνο τίτλο ρόλου.","nodes":[{"id":"n1","label":"Platform / Use Case Owner","detail":"Ιδιοκτησία πλατφόρμας / σεναρίου","status":"PROPOSED","type":"external","slot":0},{"id":"n2","label":"Knowledge Author","detail":"Συντάκτης υποψήφιας γνώσης","status":"PROPOSED","type":"backend","slot":1},{"id":"n3","label":"SME / Knowledge Approver","detail":"Ειδικός / εγκριτής γνώσης","status":"PROPOSED","type":"security","slot":2},{"id":"n4","label":"Παραγωγική λειτουργία","detail":"SRE / Model Ops / Rule Engineer","status":"PROPOSED","type":"backend","slot":3},{"id":"n5","label":"Ασφάλεια / δεδομένα","detail":"IAM / Integration Owner","status":"PROPOSED","type":"security","slot":4},{"id":"n6","label":"Audit / συμμόρφωση","detail":"Ελεγκτής και πολιτική διατήρησης","status":"PROPOSED","type":"security","slot":5}],"edges":[{"from":"n1","to":"n2","label":"ανάθεση","target":false},{"from":"n2","to":"n3","label":"επιθεώρηση","target":false},{"from":"n3","to":"n4","label":"αποδοχή","target":false},{"from":"n5","to":"n4","label":"συμβάσεις","target":false},{"from":"n6","to":"n5","label":"έλεγχος","target":false}],"notes":["PROPOSED (προτεινόμενοι) ρόλοι: η Telekom αποφασίζει πραγματικά πρόσωπα/μονάδες και διαχωρισμό συντάκτη από εγκριτή.","Rule/Agent Engineer (μηχανικός κανόνων/πρακτόρων), Model Ops (λειτουργία μοντέλων) και SRE (μηχανική αξιοπιστίας) είναι διαφορετικές ευθύνες.","Security/IAM Owner (υπεύθυνος ασφάλειας/ταυτοτήτων), Integration/Data Contract Owner (υπεύθυνος διεπαφών/συμβάσεων) και Compliance (συμμόρφωση) καλύπτουν χωριστές πύλες.","Προστίθενται Knowledge Reader (αναγνώστης γνώσης), Structural/Acquisition/EMF owners (υπεύθυνοι περιορισμών) και Radio Planning Team Lead (επικεφαλής σχεδιασμού). Δεν συνεπάγονται αυτόματα νέες προσλήψεις."],"geometry":{"edge3":{"labelAt":[1095,280]}},"source":{"title":"New roles required to operate NCT-AI","body":"**Answer.** NCT-AI needs an operating model, not only technical components. Proposed roles: **AI\nPlatform Owner** (roadmap, service ownership, production priorities, SLO/budget — likely Telekom\nIT/platform organisation); **AI Product/Use Case Owner** (use-case value, business acceptance criteria,\npriority, release acceptance — the relevant engineering/business domain); **Knowledge Author** (source\nregistration, candidate knowledge curation — an engineering domain team or delegated knowledge team);\n**SME Reviewer** (verifying technical meaning and vendor interpretation — a Telekom engineering SME);\n**Knowledge Approver** (approving knowledge/rule releases for Production, confirming source authority —\na designated senior Telekom knowledge/domain owner); **Rule/Agent Engineer** (deterministic rule\nrepresentation, agent definitions, tool contracts, test automation — the NCT-AI engineering team);\n**AI/Model Ops** (model registry, routing, validation, cost monitoring, model release — the AI platform\nteam); **SRE/Platform Operations** (AKS, PostgreSQL, Redis, Temporal, monitoring, HA/DR, patching,\nincident management — Telekom IT/cloud/platform operations); **Security/IAM Owner** (Entra ID, workload\nidentity, service authorisation, security policy, vulnerability process — Telekom Cyber Security/IAM);\n**Integration/Data Contract Owner** (NCTSite curated views, interface versions, external contracts,\nupgrade compatibility — the NCTSite/system integration team); **Audit/Compliance Reviewer** (audit\npolicy, retention review, evidence requirements, compliance verification — Telekom Security/Compliance).\nEvery governance gate this document describes — SME approval before a knowledge release activates, an\nApprover's sign-off, a Security owner for the mesh-attestation work in Q14 — needs a named person\nbehind it before Production, not only a role on a slide. Naming the actual people or organisational\nunits against this list is a Telekom decision. The additional response also identifies a Knowledge\nReader access role, Site Constraint owners (Structural, Acquisition and EMF), and a Radio Planning\nTeam Lead for quality/backlog review. Add these to the responsibility matrix without assuming they\nrequire new hires or can all be absorbed by existing staff. Workload, authority and separation of\nauthor/reviewer duties must be assigned explicitly.","sha256":"4c7715baf34f4f74c71375d2e6086e984fc0de68caf6c90eb99e0f687b6699a0"},"textDiagram":"[n1] Platform / Use Case Owner [PROPOSED]\n  +-- ανάθεση --> [n2] Knowledge Author [PROPOSED]\n  |   +-- επιθεώρηση --> [n3] SME / Knowledge Approver [PROPOSED]\n  |   |   +-- αποδοχή --> [n4] Παραγωγική λειτουργία [PROPOSED]\n\n[n6] Audit / συμμόρφωση [PROPOSED]\n  +-- έλεγχος --> [n5] Ασφάλεια / δεδομένα [PROPOSED]\n  |   +-- συμβάσεις --> [n4] Παραγωγική λειτουργία [PROPOSED] (αναφορά)"}];
    const byId = id => document.getElementById(id);
    let current = 0;
    let mode = matchMedia('(max-width: 760px)').matches ? 'text' : 'diagram';
    const key = n => 'q'+String(n).padStart(2,'0');
    function setMode(value) {
      mode=value;
      byId('diagram').hidden=value!=='diagram';
      byId('text-view').hidden=value!=='text';
      for(const kind of ['diagram','text']){
        byId('mode-'+kind).setAttribute('aria-selected',String(kind===value));
        byId('mode-'+kind).tabIndex=kind===value?0:-1;
      }
    }
    function show(index) {
      current = index;
      const item = items[index];
      byId('title').textContent = item.title;
      byId('summary').textContent = item.summary;
      byId('text-view').textContent = item.textDiagram;
      byId('number').textContent = key(item.question).toUpperCase()+' / 30';
      byId('diagram').src = item.slug+'.html';
      byId('diagram').title = 'Q'+item.question+': '+item.title;
      byId('standalone').href = item.slug+'.html';
      byId('markdown').href = item.slug+'.md';
      byId('source').textContent = item.source.title+'\n\n'+item.source.body;
      byId('notes').replaceChildren(...item.notes.map(text=>{const li=document.createElement('li');li.textContent=text;return li;}));
      byId('previous').disabled = index===0;
      byId('next').disabled = index===items.length-1;
      byId('question-select').value = String(index);
      for(const link of byId('questions').querySelectorAll('a')) {
        if(link.dataset.index===String(index))link.setAttribute('aria-current','page');
        else link.removeAttribute('aria-current');
      }
      document.title = 'Q'+item.question+' | '+item.title+' | NCT-AI';
      setMode(mode);
    }
    function select(index) { location.hash=key(items[index].question); }
    function fromHash() {
      const n=Number(location.hash.replace(/^#q/i,''));
      const index=items.findIndex(i=>i.question===n);show(index<0?0:index);
    }
    items.forEach((item,index)=>{
      const link=document.createElement('a');link.href='#'+key(item.question);link.dataset.index=String(index);
      const number=document.createElement('b');number.textContent=key(item.question).toUpperCase();
      const title=document.createElement('span');title.textContent=item.title;link.append(number,title);
      byId('questions').append(link);
      const option=document.createElement('option');option.value=index;option.textContent=key(item.question).toUpperCase()+' · '+item.title;byId('question-select').append(option);
    });
    const normal = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    byId('search').addEventListener('input',()=>{
      let count=0;const term=normal(byId('search').value.trim());
      for(const link of byId('questions').children){
        const item=items[Number(link.dataset.index)];const hit=normal('q'+item.question+' '+key(item.question)+' '+item.title+' '+item.summary).includes(term);
        link.hidden=!hit;if(hit)count++;
      }
      byId('count').textContent=count+' / 30 ερωτήσεις';byId('empty').hidden=count!==0;
    });
    byId('question-select').addEventListener('change',e=>select(Number(e.target.value)));
    for(const kind of ['diagram','text']) {
      byId('mode-'+kind).addEventListener('click',()=>setMode(kind));
      byId('mode-'+kind).addEventListener('keydown',event=>{
        if(event.key==='ArrowRight'||event.key==='ArrowLeft'){
          event.preventDefault();const other=kind==='diagram'?'text':'diagram';setMode(other);byId('mode-'+other).focus();
        }
      });
    }
    byId('previous').addEventListener('click',()=>{if(current>0)select(current-1);});
    byId('next').addEventListener('click',()=>{if(current<items.length-1)select(current+1);});
    window.addEventListener('hashchange',fromHash);
    byId('count').textContent='30 / 30 ερωτήσεις';fromHash();
  </script>
